<!DOCTYPE html>
<html lang="fa">
<head>
	<meta charset="utf-8">
	<title>UniqueRP — Citizen Registration</title>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

	<!-- Fonts -->
	<link rel="stylesheet" type="text/css" href="css/nunito-font.css">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Vazirmatn:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

	<!-- Main Style Css -->
	<link rel="stylesheet" href="css/style.css"/>

	<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
	<script src="https://unpkg.com/gijgo@1.9.13/js/gijgo.min.js" type="text/javascript"></script>
	<link href="https://unpkg.com/gijgo@1.9.13/css/gijgo.min.css" rel="stylesheet" type="text/css" />
	<link rel="stylesheet" href="css/bootstrap.min.css">
	<script src="bootstrap.min.js"></script>
</head>

<body class="form-v6" style="display:none;">

	<!-- purely decorative ambient layers, filled by script.js -->
	<div class="ambient-glow"></div>
	<div class="ambient-particles" id="ambientParticles"></div>
	<div class="ambient-vignette"></div>

	<div class="page-content">

		<div class="form-v6-content" id="formCard">

			<div class="form1">

				<!-- Live ID card preview: fills in as the player types,
				     gets stamped the moment they submit. -->
				<div class="sec2">
					<div class="id-card" id="idCard">
						<div class="id-card__top">
							<img src="./css/1112.png" class="id-card__crest" alt="UniqueRP">
							<div class="id-card__heading">
								<span class="id-card__org">Unique RP</span>
								<span class="id-card__doc">Citizen ID · New Applicant</span>
							</div>
						</div>

						<div class="id-card__photo">
							<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.7 0 4.9-2.2 4.9-4.9S14.7 2.2 12 2.2 7.1 4.4 7.1 7.1 9.3 12 12 12zm0 2.4c-3.3 0-9.8 1.6-9.8 4.9v2.5h19.6v-2.5c0-3.3-6.5-4.9-9.8-4.9z"/></svg>
						</div>

						<div class="id-card__row">
							<span class="id-card__label">First Name</span>
							<span class="id-card__value" id="previewName">— — —</span>
						</div>
						<div class="id-card__row">
							<span class="id-card__label">Last Name</span>
							<span class="id-card__value" id="previewFamily">— — —</span>
						</div>
						<div class="id-card__row">
							<span class="id-card__label">Date of Birth</span>
							<span class="id-card__value" id="previewDob">--/--/----</span>
						</div>

						<div class="id-card__barcode"></div>
						<div class="id-card__stamp" id="idStamp">Pending</div>
					</div>
					<div class="id-card__hint">این کارت با اطلاعاتی که وارد می‌کنی زنده به‌روزرسانی می‌شه</div>
				</div>

				<!-- Intake form -->
				<div class="sec1">
					<span class="eyebrow">Step 1 of 1</span>
					<h2 class="h">ثبت هویت شهروندی</h2>
					<p class="sub">برای ورود به شهر، مشخصات کاراکترت رو وارد کن. نام و نام‌خانوادگی باید با حروف انگلیسی نوشته بشن.</p>

					<form class="form-detail" action="#" method="post" autocomplete="off">
						<div class="form-row">
							<label for="name">First Name</label>
							<input type="text" name="name" id="name" class="input-text" placeholder="e.g. John" required>
						</div>
						<div class="form-row">
							<label for="family">Last Name</label>
							<input type="text" name="family" id="family" class="input-text" placeholder="e.g. Doe" required>
						</div>
						<div class="form-row">
							<label for="dateofbirth">Date of Birth</label>
							<input type="text" name="dateofbirth" id="dateofbirth" readonly class="input-text" placeholder="YYYY-MM-DD" required>
						</div>
						<div class="form-row-last">
							<input type="submit" id="register" name="register" class="register" value="صدور کارت شهروندی">
						</div>
					</form>
				</div>

			</div>

		</div>

	</div>


	<!-- Button trigger modal -->
	<button type="button" style="display:none;" id="clicktomod" data-toggle="modal" data-target="#modal"></button>

	<!-- Modal -->
	<div class="modal fade" id="modal" tabindex="-1" role="dialog" aria-labelledby="modalTitle" aria-hidden="true">
	  <div class="modal-dialog modal-dialog-centered" role="document">
	    <div class="modal-content">
	      <div class="modal-header">
	        <span class="modal-icon" aria-hidden="true">!</span>
	        <h5 class="modal-title" id="modalTitle"></h5>
	        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
	          <span aria-hidden="true">&times;</span>
	        </button>
	      </div>
	      <div class="modal-body">
	        <span id="modalText"></span>
	      </div>
	      <div class="modal-footer">
	        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
	      </div>
	    </div>
	  </div>
	</div>
	<script src="script.js" type="text/javascript"></script>

</body>
</html>
