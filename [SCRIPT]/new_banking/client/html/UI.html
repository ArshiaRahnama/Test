<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>Bank</title>
	<link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>

	<div class="app" id="app">

		<!-- ===== HOME ===== -->
		<div class="panel" id="screen-home" style="display:block;">
			<div class="panel-header">
				<div class="brand">
					<span class="brand-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-6 7 6v11"/><path d="M9 21v-6h6v6"/></svg>
					</span>
					Fleeca Bank
				</div>
				<button class="icon-btn" id="exitbank" title="Exit">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
				</button>
			</div>

			<div class="account-card">
				<div class="card-top">
					<div class="chip"></div>
					<div class="card-network">FLEECA</div>
				</div>
				<div class="card-iban">IBAN <span class="cardnumber1">----</span></div>
				<div class="card-bottom">
					<div>
						<div class="card-label">Account Holder</div>
						<div class="card-value username1">—</div>
					</div>
					<div class="card-balance"><span class="cur-symbol">$</span><span class="curbalance">0</span></div>
				</div>
			</div>

			<div class="actions-grid">
				<button id="deposit" class="action-btn">
					<span class="action-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
					</span>
					Variz (Deposit)
					<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
				</button>
				<button id="withdraw" class="action-btn">
					<span class="action-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
					</span>
					Bardasht (Withdraw)
					<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
				</button>
				<button id="transfer" class="action-btn">
					<span class="action-icon">
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H9"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12"/></svg>
					</span>
					Enteghal (Transfer)
					<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
				</button>
			</div>
		</div>

		<!-- ===== DEPOSIT ===== -->
		<div class="panel" id="screen-deposit">
			<button class="back-btn" data-cancel="deposit">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
				Bazgasht
			</button>
			<div class="subscreen-title">Variz kardan</div>
			<div class="subscreen-sub">Deposit cash into <span class="username1b">your</span> account</div>
			<div class="balance-pill">Mojoodi: $<span class="curbalance2">0</span></div>

			<form id="form-deposit">
				<div class="field-row">
					<label class="field-label">Meghdar (Amount)</label>
					<input id="amount" type="text" inputmode="numeric" placeholder="0" class="field-input" autocomplete="off">
				</div>
				<button type="submit" class="submit-btn">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
					Variz
				</button>
				<button type="button" class="cancel-link" data-cancel="deposit">Enseraf</button>
			</form>
		</div>

		<!-- ===== WITHDRAW ===== -->
		<div class="panel" id="screen-withdraw">
			<button class="back-btn" data-cancel="withdraw">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
				Bazgasht
			</button>
			<div class="subscreen-title">Bardasht kardan</div>
			<div class="subscreen-sub">Withdraw cash from <span class="username1b">your</span> account</div>
			<div class="balance-pill">Mojoodi: $<span class="curbalance3">0</span></div>

			<form id="form-withdraw">
				<div class="field-row">
					<label class="field-label">Meghdar (Amount)</label>
					<input id="amountw" type="text" inputmode="numeric" placeholder="0" class="field-input" autocomplete="off">
				</div>
				<button type="submit" class="submit-btn danger">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
					Bardasht
				</button>
				<button type="button" class="cancel-link" data-cancel="withdraw">Enseraf</button>
			</form>
		</div>

		<!-- ===== TRANSFER ===== -->
		<div class="panel" id="screen-transfer">
			<button class="back-btn" data-cancel="transfer">
				<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
				Bazgasht
			</button>
			<div class="subscreen-title">Enteghal vajh</div>
			<div class="subscreen-sub">Send money by player ID or IBAN</div>
			<div class="balance-pill">Mojoodi: $<span class="curbalance4">0</span></div>

			<form id="form-transfer">
				<div class="field-row">
					<label class="field-label">Player ID or IBAN</label>
					<input id="to" type="text" placeholder="e.g. 12  or  IR..." class="field-input" autocomplete="off">
				</div>
				<div class="field-row">
					<label class="field-label">Meghdar (Amount)</label>
					<input id="amountt" type="text" inputmode="numeric" placeholder="0" class="field-input" autocomplete="off">
				</div>
				<button type="submit" class="submit-btn">
					<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4"/><path d="M21 7H9"/><path d="M7 21l-4-4 4-4"/><path d="M3 17h12"/></svg>
					Enteghal
				</button>
				<button type="button" class="cancel-link" data-cancel="transfer">Enseraf</button>
			</form>
		</div>

	</div>

	<script>
		const app = document.getElementById('app');
		const screens = {
			home: document.getElementById('screen-home'),
			deposit: document.getElementById('screen-deposit'),
			withdraw: document.getElementById('screen-withdraw'),
			transfer: document.getElementById('screen-transfer'),
		};

		function showScreen(name){
			Object.values(screens).forEach(s => s.style.display = 'none');
			screens[name].style.display = 'block';
		}

		function post(endpoint, data){
			fetch(`http://new_banking/${endpoint}`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json; charset=UTF-8' },
				body: JSON.stringify(data || {})
			}).catch(() => {});
		}

		function closeBank(){
			app.style.display = 'none';
			post('NUIFocusOff');
		}

		function formatMoney(n){
			const num = Number(n) || 0;
			return num.toLocaleString('en-US');
		}

		window.addEventListener('message', function(event){
			const data = event.data;
			if (data.type === 'openGeneral'){
				app.style.display = 'block';
				showScreen('home');
			} else if (data.type === 'balanceHUD'){
				const formatted = formatMoney(data.balance);
				document.querySelectorAll('.username1').forEach(el => el.textContent = data.player);
				document.querySelectorAll('.username1b').forEach(el => el.textContent = data.player);
				document.querySelectorAll('.cardnumber1').forEach(el => el.textContent = data.cardnumber);
				document.querySelectorAll('.curbalance').forEach(el => el.textContent = formatted);
				document.querySelectorAll('.curbalance2').forEach(el => el.textContent = formatted);
				document.querySelectorAll('.curbalance3').forEach(el => el.textContent = formatted);
				document.querySelectorAll('.curbalance4').forEach(el => el.textContent = formatted);
			} else if (data.type === 'closeAll'){
				app.style.display = 'none';
			}
		});

		document.getElementById('exitbank').addEventListener('click', closeBank);

		document.querySelectorAll('[data-cancel]').forEach(btn => {
			btn.addEventListener('click', () => showScreen('home'));
		});

		document.getElementById('deposit').addEventListener('click', () => showScreen('deposit'));
		document.getElementById('withdraw').addEventListener('click', () => showScreen('withdraw'));
		document.getElementById('transfer').addEventListener('click', () => showScreen('transfer'));

		document.getElementById('form-deposit').addEventListener('submit', function(e){
			e.preventDefault();
			post('deposit', { amount: document.getElementById('amount').value });
			closeBank();
		});

		document.getElementById('form-withdraw').addEventListener('submit', function(e){
			e.preventDefault();
			post('withdrawl', { amountw: document.getElementById('amountw').value });
			closeBank();
		});

		document.getElementById('form-transfer').addEventListener('submit', function(e){
			e.preventDefault();
			post('transfer', {
				to: document.getElementById('to').value,
				amountt: document.getElementById('amountt').value
			});
			closeBank();
		});

		document.addEventListener('keyup', function(e){
			if (e.key === 'Escape'){
				closeBank();
			}
		});
	</script>
</body>
</html>
