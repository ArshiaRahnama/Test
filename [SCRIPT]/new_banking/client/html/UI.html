	<link href="style.css" rel="stylesheet" type="text/css" />

<body>

	<div class="app" id="app">
		<div class="shell">

			<!-- ===== SIDEBAR ===== -->

					</button>

				<div class="profile-card">

					</div>
					<div class="profile-stats">
						<div class="profile-stat">
							<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V10l7-6 7 6v11"/><path d="M9 21v-6h6v6"/></svg>

							<span class="val">$<span class="curcash" id="cashMini">0</span></span>
						</div>
					</div>

			<!-- ===== MAIN CONTENT ===== -->
			<main class="content">

				<canvas id="confettiCanvas"></canvas>
				<div class="toast" id="toast">
					<span class="toast-icon" id="toastIcon"></span>
					<span class="toast-text fa" id="toastText"></span>
				</div>

				<!-- ===== DASHBOARD ===== -->
				<div class="panel" id="screen-home" style="display:flex;">
					<div class="top-row">
						<div class="account-card" id="accountCard" title="کپی شماره کارت">
							<img src="sun/card.png" alt="">
							<h1 class="card-number" id="cardNumber">----</h1>
							<span class="copy-toast fa" id="copyToast">کپی شد</span>

						<div class="info-col">

							</div>
							<div class="info-box">

								<div class="info-text">

	<script>
		const app = document.getElementById('app');
		const screens = {
			home: document.getElementById('screen-home'),
			cash: document.getElementById('screen-cash'),
			transfer: document.getElementById('screen-transfer'),
		};
		const navButtons = {
			home: document.getElementById('navHome'),
			cash: document.getElementById('navCash'),
			transfer: document.getElementById('navTransfer'),
		};

		let onlinePlayers = [];
		let currentIban = '';
		let currentBank = 0;
		let currentCash = 0;
		let pendingTransfer = null;
		let historyRows = [];
		let cashFilter = 'all';
		let transferFilter = 'all';

		// ================= Fit to screen (window is designed at 1000x600) =================

		function fitScale(){
			const s = Math.min(1, window.innerWidth / 1040, window.innerHeight / 640);
			app.style.setProperty('--ui-scale', s);
		}
		window.addEventListener('resize', fitScale);
		fitScale();

		// ================= Navigation =================

		function showScreen(name){
			Object.values(screens).forEach(s => s.style.display = 'none');
			screens[name].style.display = 'flex';
			Object.entries(navButtons).forEach(([key, btn]) => {
				btn.classList.toggle('active', key === name);
			});
			post('history');
			if (name === 'transfer'){
				post('getOnlinePlayers');
				post('recentContacts');
				document.getElementById('to').value = '';
				document.getElementById('amountt').value = '';
				delete document.getElementById('to').dataset.pickedName;
				updateToHint();
				document.getElementById('suggestBox').style.display = 'none';
			}
		}

		function post(endpoint, data){
			fetch(`http://new_banking/${endpoint}`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json; charset=UTF-8' },
				body: JSON.stringify(data || {})
			}).catch(() => {});
		}

		function closeBank(){
			app.style.display = 'none';
			post('NUIFocusOff');
		}

		function formatMoney(n){
			const num = Number(n) || 0;
			return Math.round(num).toLocaleString('en-US');
		}

		function formatCard(c){
			c = String(c || '');
			return /^\d{6}$/.test(c) ? c.slice(0, 3) + '-' + c.slice(3) : c;
		}

		function formatDate(v){
			const d = v ? new Date(v) : null;
			if (!d || isNaN(d.getTime())) return '';
			const p = n => String(n).padStart(2, '0');
			return `${String(d.getFullYear()).slice(2)}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
		}

		function esc(s){
			return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
		}

		// ================= Copy to clipboard =================

		function copyToClipboard(text){
			if (navigator.clipboard && navigator.clipboard.writeText){
				navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
			} else {
				fallbackCopy(text);
			}
		}

		function fallbackCopy(text){
			const ta = document.createElement('textarea');
			ta.value = text;
			ta.style.position = 'fixed';
			ta.style.opacity = '0';
			document.body.appendChild(ta);
			ta.focus();
			ta.select();
			try { document.execCommand('copy'); } catch (e) {}
			document.body.removeChild(ta);
		}

		// ================= Animated number counter =================

		function animateNumber(el, from, to, duration){
			from = Number(from) || 0;
			to = Number(to) || 0;
			if (from === to){ el.textContent = formatMoney(to); return; }
			const start = performance.now();
			function tick(now){
				const t = Math.min(1, (now - start) / duration);
				const eased = 1 - Math.pow(1 - t, 3);
				el.textContent = formatMoney(from + (to - from) * eased);
				if (t < 1) requestAnimationFrame(tick);
				else el.textContent = formatMoney(to);
			}
			requestAnimationFrame(tick);
		}

		function updateBalanceDisplays(newBalance){
			document.querySelectorAll('.curbalance').forEach(el => {
				animateNumber(el, currentBank, newBalance, 700);
			});
			currentBank = newBalance;
		}

		function updateCashDisplays(){
			document.querySelectorAll('.curcash').forEach(el => {
				el.textContent = formatMoney(currentCash);
			});
		}

		// ================= Sound effects (Web Audio, no external files) =================

		let audioCtx = null;
		function getAudioCtx(){
			if (!audioCtx){
				const AC = window.AudioContext || window.webkitAudioContext;
				if (AC) audioCtx = new AC();
			}
			return audioCtx;
		}

		function playTone(freq, startTime, duration, type, gain){
			const ctx = getAudioCtx();
			if (!ctx) return;
			const osc = ctx.createOscillator();
			const g = ctx.createGain();
			osc.type = type || 'sine';
			osc.frequency.value = freq;
			g.gain.value = 0;
			osc.connect(g);
			g.connect(ctx.destination);
			const t0 = ctx.currentTime + startTime;
			g.gain.linearRampToValueAtTime(gain || 0.05, t0 + 0.02);
			g.gain.exponentialRampToValueAtTime(0.0001, t0 + duration);
			osc.start(t0);
			osc.stop(t0 + duration + 0.05);
		}

		function playSuccessChime(){
			playTone(660, 0, 0.14, 'triangle', 0.06);
			playTone(880, 0.1, 0.18, 'triangle', 0.06);
			playTone(1320, 0.2, 0.22, 'triangle', 0.05);
		}

		function playWithdrawThud(){
			playTone(220, 0, 0.18, 'sine', 0.07);
			playTone(160, 0.08, 0.22, 'sine', 0.06);
		}

		function playErrorBuzz(){
			playTone(180, 0, 0.12, 'sawtooth', 0.04);
			playTone(140, 0.1, 0.16, 'sawtooth', 0.04);
		}

		// ================= Confetti =================

		const confettiCanvas = document.getElementById('confettiCanvas');
		const ctx2d = confettiCanvas.getContext('2d');
		let confettiParticles = [];
		let confettiRunning = false;

		function resizeConfettiCanvas(){
			confettiCanvas.width = confettiCanvas.parentElement.offsetWidth;
			confettiCanvas.height = confettiCanvas.parentElement.offsetHeight;
		}

		function burstConfetti(){
			resizeConfettiCanvas();
			const colors = ['#6359E9', '#4f47be', '#9333ea', '#4ade80', '#fde047'];
			const cx = confettiCanvas.width / 2;
			for (let i = 0; i < 46; i++){
				confettiParticles.push({
					x: cx + (Math.random() - 0.5) * 60,
					y: 70 + Math.random() * 20,
					vx: (Math.random() - 0.5) * 6,
					vy: -(Math.random() * 5 + 3),
					size: Math.random() * 5 + 3,
					color: colors[Math.floor(Math.random() * colors.length)],
					rot: Math.random() * Math.PI,
					vr: (Math.random() - 0.5) * 0.3,
					life: 0,
				});
			}
			if (!confettiRunning){
				confettiRunning = true;
				requestAnimationFrame(confettiTick);
			}
		}

		function confettiTick(){
			ctx2d.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
			confettiParticles.forEach(p => {
				p.vy += 0.16;
				p.x += p.vx;
				p.y += p.vy;
				p.rot += p.vr;
				p.life += 1;
				ctx2d.save();
				ctx2d.translate(p.x, p.y);
				ctx2d.rotate(p.rot);
				ctx2d.globalAlpha = Math.max(0, 1 - p.life / 90);
				ctx2d.fillStyle = p.color;
				ctx2d.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
				ctx2d.restore();
			});
			confettiParticles = confettiParticles.filter(p => p.life < 90 && p.y < confettiCanvas.height + 20);
			if (confettiParticles.length){
				requestAnimationFrame(confettiTick);
			} else {
				confettiRunning = false;
				ctx2d.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
			}
		}

		// ================= Toast =================

		let toastTimer = null;
		function showToast(ok, text){
			const toast = document.getElementById('toast');
			const icon = document.getElementById('toastIcon');
			const txt = document.getElementById('toastText');
			toast.classList.remove('ok', 'err');
			toast.classList.add(ok ? 'ok' : 'err');
			icon.innerHTML = ok
				? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>'
				: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>';
			txt.textContent = text;
			toast.classList.add('show');
			clearTimeout(toastTimer);
			toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
		}

		// ================= Balance history chart =================
		// Builds a real 31-point balance trend (today, and 30 days back) from the
		// account's transaction history, so the dashboard chart reflects actual
		// deposits / withdrawals / transfers rather than fake data.

		function signOf(type){
			if (type === 'deposit' || type === 'transfer_in') return 1;
			if (type === 'withdraw' || type === 'transfer_out') return -1;
			return 0;
		}

		function computeBalanceSeries(rows){
			const DAY = 86400000;
			const now = Date.now();
			const cutoff = now - 30 * DAY;

			const signed = (rows || [])
				.map(r => {
					const t = r.created_at ? new Date(r.created_at).getTime() : NaN;
					if (isNaN(t) || t < cutoff) return null;
					return { t, amount: signOf(r.type) * (Number(r.amount) || 0) };
				})
				.filter(Boolean)
				.sort((a, b) => a.t - b.t);

			const netInRange = signed.reduce((sum, r) => sum + r.amount, 0);
			const baseline = currentBank - netInRange;

			const snapshots = [{ t: cutoff, balance: baseline }];
			let running = baseline;
			signed.forEach(r => {
				running += r.amount;
				snapshots.push({ t: r.t, balance: running });
			});
			snapshots.push({ t: now, balance: currentBank });

			const points = [];
			for (let i = 0; i <= 30; i++){
				const dayTime = cutoff + i * DAY;
				let val = snapshots[0].balance;
				for (const s of snapshots){
					if (s.t <= dayTime) val = s.balance;
					else break;
				}
				points.push(Math.max(0, val));
			}
			return points;
		}

		function niceMax(value){
			if (value <= 0) return 10;
			const magnitude = Math.pow(10, Math.floor(Math.log10(value)));
			const steps = [1, 2, 2.5, 5, 10];
			for (const s of steps){
				if (value <= s * magnitude) return s * magnitude;
			}
			return 10 * magnitude;
		}

		function drawBalanceChart(rows){
			const wrap = document.getElementById('chartWrap');
			const points = computeBalanceSeries(rows);
			const w = 706, h = 262;
			const padL = 64, padR = 18, padT = 14, padB = 26;
			const plotW = w - padL - padR;
			const plotH = h - padT - padB;

			const maxVal = niceMax(Math.max(...points, 1));
			const gridCount = 4;

			const xFor = i => padL + (plotW * i) / 30;
			const yFor = v => padT + plotH - (plotH * v) / maxVal;

			let yLabels = '';
			for (let g = 0; g <= gridCount; g++){
				const v = (maxVal / gridCount) * g;
				yLabels += `<text x="${padL - 10}" y="${yFor(v) + 4}" text-anchor="end" class="chart-axis-text">${formatMoney(v)}</text>`;
			}

			let xLabels = '';
			for (let i = 0; i <= 30; i += 2){
				xLabels += `<text x="${xFor(i)}" y="${h - 6}" text-anchor="middle" class="chart-axis-text">${i}</text>`;
			}

			const linePath = points.map((v, i) => `${i === 0 ? 'M' : 'L'} ${xFor(i).toFixed(1)} ${yFor(v).toFixed(1)}`).join(' ');
			const dots = points.map((v, i) => `<circle cx="${xFor(i).toFixed(1)}" cy="${yFor(v).toFixed(1)}" r="3.5" class="chart-dot"/>`).join('');
			const axis = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#006BD6" stroke-width="3"/>
				<line x1="${padL}" y1="${padT + plotH}" x2="${w - padR}" y2="${padT + plotH}" stroke="#006BD6" stroke-width="3"/>`;

			wrap.innerHTML = `
				<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
					${axis}
					${yLabels}
					${xLabels}
					<path d="${linePath}" class="chart-line"/>
					${dots}
				</svg>
			`;
		}

		// ================= History tables =================

		function withBalanceAfter(rows){
			// server sends newest first; walk back from the current balance
			let running = currentBank;
			return rows.map(r => {
				const after = running;
				running -= signOf(r.type) * (Number(r.amount) || 0);
				return Object.assign({}, r, { after });
			});
		}

		function renderCashTable(){
			const box = document.getElementById('cashTable');
			let rows = withBalanceAfter(historyRows).filter(r => r.type === 'deposit' || r.type === 'withdraw');
			if (cashFilter !== 'all') rows = rows.filter(r => r.type === cashFilter);
			if (!rows.length){
				box.innerHTML = '<div class="empty fa">هنوز تراکنشی را ثبت نکردید</div>';
				return;
			}
			box.innerHTML = `<table>
				<thead><tr>
					<th style="width:8%"></th><th style="width:25%">تاریخ</th><th style="width:25%">مبلغ</th>
					<th style="width:25%">موجودی پس از تراکنش</th><th style="width:17%">نوع</th>
				</tr></thead>
				<tbody>${rows.map(r => {
					const dep = r.type === 'deposit';
					return `<tr class="row">
						<td><div class="icon-cell"><img src="sun/${dep ? 'down' : 'up'}.png" alt=""></div></td>
						<td>${formatDate(r.created_at)}</td>
						<td class="${dep ? 'pos' : 'neg'}">${dep ? '+' : '-'} $${formatMoney(r.amount)}</td>
						<td class="gold">$${formatMoney(r.after)}</td>
						<td class="pulse ${dep ? 'pos' : 'neg'}">${dep ? 'واریز' : 'برداشت'}</td>
					</tr>`;
				}).join('')}</tbody></table>`;
		}

		function renderTransferTable(){
			const box = document.getElementById('transferTable');
			let rows = withBalanceAfter(historyRows).filter(r => r.type === 'transfer_in' || r.type === 'transfer_out');
			if (transferFilter === 'deposit') rows = rows.filter(r => r.type === 'transfer_in');
			if (transferFilter === 'withdraw') rows = rows.filter(r => r.type === 'transfer_out');
			if (!rows.length){
				box.innerHTML = '<div class="empty fa">هنوز تراکنشی را ثبت نکردید</div>';
				return;
			}
			box.innerHTML = `<table>
				<thead><tr>
					<th style="width:34%">نام</th><th style="width:22%">تاریخ</th>
					<th style="width:20%">مبلغ</th><th style="width:24%">موجودی پس از تراکنش</th>
				</tr></thead>
				<tbody>${rows.map(r => {
					const inn = r.type === 'transfer_in';
					return `<tr class="row">
						<td><div class="icon-cell"><img src="sun/${inn ? 'down' : 'up'}.png" alt="">${esc(r.counterparty || '—')}</div></td>
						<td>${formatDate(r.created_at)}</td>
						<td class="${inn ? 'pos' : 'neg'}">${inn ? '+' : '-'}$${formatMoney(r.amount)}</td>
						<td class="gold">$${formatMoney(r.after)}</td>
					</tr>`;
				}).join('')}</tbody></table>`;
		}

		function renderTables(){
			renderCashTable();
			renderTransferTable();
		}

		function bindTabs(id, setter){
			document.getElementById(id).addEventListener('click', function(e){
				const btn = e.target.closest('.tab');
				if (!btn) return;
				this.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === btn));
				setter(btn.dataset.filter);
				renderTables();
			});
		}
		bindTabs('cashTabs', f => cashFilter = f);
		bindTabs('transferTabs', f => transferFilter = f);

		// ================= Contacts / transfer hint =================

		function updateToHint(){
			const hint = document.getElementById('toHint');
			const name = toInput.dataset.pickedName;
			if (name){
				hint.style.color = '';
				hint.innerHTML = `<span class="who">${esc(name)}</span> : انتقال به`;
			} else {
				hint.style.color = 'transparent';
				hint.textContent = 'شماره کارت را وارد کنید';
			}
		}

		function renderContacts(rows){
			const box = document.getElementById('contactsRow');
			if (!rows.length){
				box.innerHTML = '';
				box.style.display = 'none';
				return;
			}
			box.style.display = 'flex';
			box.innerHTML = rows.map(r => `<div class="contact-chip" data-id="${esc(r.counterparty_id)}" data-name="${esc(r.counterparty)}">${esc(r.counterparty)}</div>`).join('');
		}

		document.getElementById('contactsRow').addEventListener('click', function(e){
			const chip = e.target.closest('.contact-chip');
			if (!chip) return;
			toInput.value = chip.dataset.id;
			toInput.dataset.pickedName = chip.dataset.name;
			updateToHint();
		});

		// ================= Wiring =================

		document.getElementById('exitbank').addEventListener('click', closeBank);

		document.getElementById('accountCard').addEventListener('click', function(){
			if (!currentIban) return;
			copyToClipboard(currentIban);
			const toast = document.getElementById('copyToast');
			toast.classList.add('show');
			setTimeout(() => toast.classList.remove('show'), 1200);
		});

		document.getElementById('navHome').addEventListener('click', () => showScreen('home'));
		document.getElementById('navCash').addEventListener('click', () => showScreen('cash'));
		document.getElementById('navTransfer').addEventListener('click', () => showScreen('transfer'));

		// ---- Deposit / Withdraw ----
		const cashInput = document.getElementById('cashAmount');
		cashInput.addEventListener('keydown', e => { if (e.key === 'Enter') e.preventDefault(); });

		document.getElementById('btnDeposit').addEventListener('click', function(){
			const val = cashInput.value.replace(/[^0-9]/g, '');
			if (!val || Number(val) <= 0) return;
			post('deposit', { amount: val });
			cashInput.value = '';
		});

		document.getElementById('btnWithdraw').addEventListener('click', function(){
			const val = cashInput.value.replace(/[^0-9]/g, '');
			if (!val || Number(val) <= 0) return;
			post('withdrawl', { amountw: val });
			cashInput.value = '';
		});

		// ---- Transfer: name-search suggestions ----
		const toInput = document.getElementById('to');
		const suggestBox = document.getElementById('suggestBox');

		toInput.addEventListener('input', function(){
			delete toInput.dataset.pickedName;
			updateToHint();
			const q = toInput.value.trim().toLowerCase();
			if (!q || /^\d+$/.test(q)){
				suggestBox.style.display = 'none';
				suggestBox.innerHTML = '';
				return;
			}
			const matches = onlinePlayers.filter(p => p.name.toLowerCase().includes(q)).slice(0, 6);
			if (!matches.length){
				suggestBox.style.display = 'none';
				suggestBox.innerHTML = '';
				return;
			}
			suggestBox.innerHTML = matches.map(p => `<div class="suggest-item" data-id="${esc(p.id)}" data-name="${esc(p.name)}">${esc(p.name)} <span class="suggest-id">#${esc(p.id)}</span></div>`).join('');
			suggestBox.style.display = 'block';
		});

		suggestBox.addEventListener('click', function(e){
			const item = e.target.closest('.suggest-item');
			if (!item) return;
			toInput.value = item.dataset.id;
			toInput.dataset.pickedName = item.dataset.name;
			suggestBox.style.display = 'none';
			suggestBox.innerHTML = '';
			updateToHint();
		});

		document.addEventListener('click', function(e){
			if (!e.target.closest('.transfer-fields')){
				suggestBox.style.display = 'none';
			}
		});

		// ---- Transfer: confirmation modal ----
		const confirmOverlay = document.getElementById('confirmOverlay');

		document.getElementById('btnSend').addEventListener('click', function(){
			const to = toInput.value.trim();
			const amountt = document.getElementById('amountt').value.replace(/[^0-9]/g, '');
			if (!to || !amountt) return;

			const label = toInput.dataset.pickedName ? `${toInput.dataset.pickedName} (#${to})` : to;
			document.getElementById('confirmText').innerHTML =
				`<span class="g">${esc(label)}</span> (به) <span class="g">$${formatMoney(amountt)}</span>`;
			pendingTransfer = { to, amountt };
			confirmOverlay.classList.add('show');
		});

		document.getElementById('confirmYes').addEventListener('click', function(){
			if (pendingTransfer){
				post('transfer', pendingTransfer);
				pendingTransfer = null;
			}
			confirmOverlay.classList.remove('show');
			toInput.value = '';
			document.getElementById('amountt').value = '';
			delete toInput.dataset.pickedName;
			updateToHint();
		});

		document.getElementById('confirmNo').addEventListener('click', function(){
			pendingTransfer = null;
			confirmOverlay.classList.remove('show');
		});

		document.addEventListener('keyup', function(e){
			if (e.key === 'Escape'){
				if (confirmOverlay.classList.contains('show')){
					confirmOverlay.classList.remove('show');
					pendingTransfer = null;
				} else {
					closeBank();
				}
			}
		});

		// ================= NUI messages from Lua =================

		window.addEventListener('message', function(event){
			const data = event.data;
			if (data.type === 'openGeneral'){
				fitScale();
				app.style.display = 'block';
				showScreen('home');
			} else if (data.type === 'balanceHUD'){
				currentIban = data.cardnumber;
				if (typeof data.cash === 'number') currentCash = data.cash;
				document.querySelectorAll('.username1').forEach(el => el.textContent = String(data.player || '').replace(/_/g, ' '));
				const cn = document.getElementById('cardNumber');
				cn.textContent = formatCard(data.cardnumber);
				cn.classList.toggle('long', String(cn.textContent).length > 8);
				updateBalanceDisplays(data.balance);
				updateCashDisplays();
				drawBalanceChart(historyRows);
				renderTables();
			} else if (data.type === 'closeAll'){
				app.style.display = 'none';
			} else if (data.type === 'onlinePlayers'){
				onlinePlayers = data.players || [];
			} else if (data.type === 'historyData'){
				historyRows = data.rows || [];
				drawBalanceChart(historyRows);
				renderTables();
			} else if (data.type === 'recentContacts'){
				renderContacts(data.rows || []);
			} else if (data.type === 'actionResult'){
				handleActionResult(data);
			}
		});

		function handleActionResult(data){
			const labels = { deposit: 'واریز', withdraw: 'برداشت', transfer: 'انتقال' };
			const label = labels[data.kind] || 'عملیات';
			if (data.ok){
				showToast(true, `${label} با موفقیت انجام شد: $${formatMoney(data.amount)}`);
				if (data.kind === 'withdraw'){
					playWithdrawThud();
				} else {
					playSuccessChime();
					burstConfetti();
				}
				post('history');
			} else {
				showToast(false, `${label} انجام نشد`);
				playErrorBuzz();
			}
		}

		// Draw an empty chart shell before first data arrives.
		drawBalanceChart([]);
		renderTables();
	</script>
</body>
</html>
