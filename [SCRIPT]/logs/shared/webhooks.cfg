# اجرا کن این فایل رو از سرور سی‌اف‌جی اصلی، یا محتواش رو داخل server.cfg بذار.
# این فایل نباید commit/push بشه به گیت — حتماً به .gitignore اضافه‌اش کن.
#
# ⚠️ هشدار امنیتی مهم: نسخه‌ی قبلی این فایل با لینک‌های واقعی وبهوک دیسکورد و توکن
# سایت مستقیم commit شده بود تو این ریپوی گیت‌هاب (که Public هم بود) — یعنی اون
# توکن‌ها لو رفته حساب می‌شن. تمام مقدارهای پایین موقع ادغام Unique_LogPanel با
# logs به WEBHOOK_LINK_HERE ریست شدن. قبل از هر چیز:
#  1) تو دیسکورد، همه‌ی این وبهوک‌ها رو Regenerate کن (Integrations -> Webhooks -> Delete/Regenerate)
#  2) توکن unique_logs_SiteLogWebhook (webhook.php?token=...) رو هم تو سایت خودت عوض کن
#  3) تاریخچه‌ی گیت این فایل رو هم پاک‌سازی کن (فقط حذف نسخه‌ی فعلی کافی نیست؛ کامیت‌های
#     قبلی همچنان تو گیت‌هاب قابل مشاهده‌ان - از git filter-repo یا BFG Repo-Cleaner استفاده کن)
#  4) فقط بعد از اون، لینک‌های تازه رو جای WEBHOOK_LINK_HERE بذار
#
# هر خطی که WEBHOOK_LINK_HERE بمونه، همون دسته صرفاً تو دیتابیس/پنل/سایت ثبت می‌شه
# و به دیسکورد فرستاده نمی‌شه (کرش نمی‌کنه، فقط ساکت skip می‌شه).

