<!DOCTYPE html>
<html>
	<head>
	  <meta charset="utf-8">
	  <title></title>
	  <link href="style.css" rel="stylesheet"></link>
	  <script src="colorpicker.js" type="text/javascript"></script>
	</head>
	<body>
		<div id="container" style="display: none;" >
			<div style="height: 10%;
						bottom: 2%;
						width: 5.5%;
						right: 1%;
						position: absolute;">
				<div class="valueContainer">
					<span id="hueValue" class="valueDisplay">0</span>
				</div>
				<div class="valueContainer notfirst">
					<span id="saturationValue" class="valueDisplay">100</span>
				</div>
				<div class="valueContainer notfirst">
					<span id="valueValue" class="valueDisplay">100</span>
				</div>
			</div>
			<div style="height: 10%;
						bottom: 2%;
						left: 1%;
						right: 7%;
						position: absolute;">
				<div class="slider">
					<div id="hue" class="fillparent" style="background-image: linear-gradient(to right, rgba(255,0,0,255), rgba(255,255,0,255), rgba(0,255,0,255), rgba(0,255,255,255), rgba(0,0,255,255), rgba(255,0,255,255), rgba(255,0,0,255));">
					</div>
					<div id="hueMarker" class="activemarker fillparent" style="display:block"></div>
					<div id="huePicker" class="picker" style="left:0%"></div>
				</div>
				<div class="slider notfirst">
					<div id="saturation" class="fillparent" style="background-color:red;" ></div>
					<div class="grad fillparent" style="background-image: linear-gradient(to right, rgba(255,255,255,255), rgba(255,255,255,0));" ></div>
					<div id="valueMod" class="fillparent" style="opacity:0; background-color:black;" ></div>
					<div id="saturationMarker" class="activemarker fillparent" style="display:none"></div>
					<div id="saturationPicker" class="picker" style="left:100%"></div>
				</div>
				<div class="slider notfirst">
					<div id="value" class="fillparent"  style="background-color:red;"></div>
					<div id="saturationMod" class="fillparent" style="opacity:0; background-color:white;" ></div>
					<div class="grad fillparent" style="background-image: linear-gradient(to right, rgba(0,0,0,255), rgba(0,0,0,0));" ></div>
					<div id="valueMarker" class="activemarker fillparent" style="display:none"></div>
					<div id="valuePicker" class="picker" style="left:100%"></div>
				</div>
			</div>
		</div>
		<script>
		(function() {
			// BUG FIX (merge into esx_uniquejobs): this used to be
			// `if (this[item.type]) { this[item.type](item); }` -- calling
			// ANY window-scoped function whose name happens to match an
			// incoming message's `type`. That was harmless as this file's own
			// standalone ui_page, since nothing else could ever message it --
			// but merged in here, this iframe receives every OTHER merged
			// app's SendNuiMessage too (cad, doj, detective, evidence, radar,
			// bodydamage, taximeter all broadcast to every iframe, see
			// ui.html's relay()), so an unrelated type name could have called
			// an arbitrary global function. Whitelisted to just the three
			// this file actually uses.
			var handlers = { ON_SHOW: true, ON_COLOR_CHANGED: true, ON_HIGHLIGHT: true };
			window.addEventListener('message', (event) => {
				const item = event.data;
				if (item && handlers[item.type] && typeof this[item.type] === 'function') {
					this[item.type](item);
				}
			});
		})();
		</script>
	</body>
</html>
