<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Match Making Lobby</title>
        <script src="nui://game/ui/jquery.js" type="text/javascript"></script> <!-- FiveM JQuery -->
        <link href="./assets/css/style.css" rel="stylesheet" type="text/css">
        <script src="./assets/js/script.js" type="text/javascript"></script>
        <script src="https://code.jquery.com/jquery-3.5.1.min.js" type="text/javascript"></script>
    </head>
    <body>

        <div id="headerss" style="display:none;">
            <div id="match_teams">
              <div id="round_info" style="height: 100%;">
                <div class="team_info" id="team_1" style="height: 100%;">
                  <div class="team1_score" id="team_score">0</div>
                  <div id="team_logo">
                    <div id="team_flag"></div><img id="team_1_logo">
                  </div>
                  <div id="team_name" class="white">Team 1</div>
                  
                </div>
                <div class="team_info" id="team_2" style="height: 100%;">
                  <div class="team2_score" id="team_score">0</div>
                  <div id="team_logo">
                    <div id="team_flag"></div><img id="team_2_logo">
                  </div>
                  <div id="team_name" class="orange">Team 2</div>
                </div>
                <div class="bg-info">
                  <div id="time_counter">00:00</div>
                  <div id="round_counter">Best Of</div>
                </div>
              </div>
            </div>
          </div>

        <div class="lobby" style="display: none;user-select: none;">
            <div class="question" style="display: block;">
                <button id="btn_Create" class="tooltip"  onclick="onCreateLobby()" type="button">
				 <span class="tooltiptext">Fee To Create</span>
				Create Lobby
				</button>
                <button onclick="onJoinLobby()" type="button">
				Join Lobby
				</button>
            </div>

            <div class="list" style="display: none;">
                <div class="boxlobbeys">
                    <div class="lobby-password" style="display: none;">
                        <div class="inputs-pass">
                            <label for="lpass">Lobby Password:</label>
                            <input type="password" id="lpass" name="lpass" maxlength="10">
                        </div>
                    </div>
                </div>
				
                <div onclick="onBackQuestion()" class="footer buttom leave">
                    <h4 class="buttom-text">Back</h4>
                </div>
				 <div onclick="onBackQuestion();onJoinLobby();" class="footer buttom right start">
                    <h4 class="buttom-text">Refresh</h4>
                </div>
            </div>

            <div name="createlobby" style="display: none;">
			
			
			 
                <div class="selectmap" style="display: block;">
					<div class="select" id="type-section">
						<label for="typem">Choose Type:</label>
						<select onchange="FilterTypematch()" id="typem">
								<option value="0">Choose match type</option>
								<option value="tdm">TDM(Team death match)</option>
								<option value="sdm">SDM(Solo death match)</option>
						</select>
					</div>
					<div class="select" id="map-section"  style="display: none;">
                        <label for="map">Choose Maps:</label>
                        <select onchange="onChangeMap()" id="map">
						    <option class="sdm tdm" value="0">Choose a Map</option>
					    	<option class="sdm tdm" value="keshti">Keshti</option>
							<option class="sdm tdm" value="air">Air</option>
                        </select>
						</br>
						<img class="map-img" src="./assets/imgs/0.jpg" alt="SelectMaps">
                    </div>
                    
                    
                    
                </div>

                <div class="selectmap weapon-select" style="display: none;">
                    <p class="weapon-title">Choose vehicle</p>
                    <img class="weapon" src="./assets/vehicles/monster.png" alt="map-image">
                    <p class="selector sleft"><button onclick="LeftWeaponButton()" style="color: red;" id="sbutton-left"><span><</span></button></p>
                    <p class="selector sright"><button onclick="RightWeaponButton()" style="color: red;" id="sbutton-right"><span>></span></button></p>
                    <p id="monster" class="weapon-name">Monster</p>
                    <!-- <p id="advancedrifle" class="weapon-price">Free</p> -->
                </div>

                <div class="setting" style="display: none;">
                    <p class="title">Match Settings</p>
                    <div class="form">
                        <ul>
					       <li>
								<label for="fee">Fee:</label>
								<select id="fee" name="fee">
										<option value="0">1x Coin > ?</option>
										<option value="1">1x TC</option>
										<option value="2">$10,000</option>
								</select>
                           </li>
                            <li>
                                <label for="lname">Lobby Name:</label>
                                <input type="text" id="lname" name="lname" minlength="3" maxlength="15">
                            </li>
                            <li>
                                <label for="lbpass">Lobby Pass:</label>
                                <input type="password" id="lbpass" name="lbpass" maxlength="10">
                            </li>
                            <li>
                                <label for="round">Rounds:</label>
                                <input type="number" id="round" name="round" min="1" max="5" value="1">
                            </li>
                            <!-- <li>
                                <label for="timer">Timer(s):</label>
                                <input type="number" id="timer" name="timer" min="30" max="300" value="120">
                            </li>
                            <li>
                                <label for="armor">Armor:</label>
                                <input type="number" id="armor" name="armor" min="0" max="100" value="0">
                            </li>
                            <li>
                                 <label for="head">Head Box:</label>
                                  <select id="head" name="head">
                                     <option value="1">Enabaled</option>
                                     <option value="0">Disabaled</option>
                                  </select>
                            </li> -->
                        </ul>
                    </div>
                </div>
                <div id="cancelButton" onclick="onCancel()" class="footer buttom leave">
                    <h4 class="buttom-text">Cancel</h4>
                </div>
                <div id="backButton" onclick="onBack()" class="footer buttom leave" style="display: none;">
                    <h4 class="buttom-text">Back</h4>
                </div>
                <div id="nextButton" onclick="onNext()" class="footer buttom right start">
                    <h4 class="buttom-text">Next</h4>
                </div>
                <div id="submitButton" onclick="onSubmit()" class="footer buttom right start tooltip" style="display: none;">
				 <span class="tooltiptext">Fee To Create</span>
                    <h4 class="buttom-text">Submit</h4>
                </div>
            </div>
            
            <div name="main" style="display: none;">
                <h1 class="header">Match Making Lobby</h1>

                <div class="box joiners">
                    <h1 class="header join">Joined Players</h1>
                </div>

                <div class="box teamone" id="boxt1">
                    <h1 class="header join">Team One</h1>
                    <h1 class="header join elb enter" id="TM-1" onclick="onJoin(this.id)">Join</h1>
                </div>

                <div class="box teamtwo" id="boxt2">
                    <h1 class="header join">Team Two</h1>
                    <h1 class="header join elb enter" id="TM-2" onclick="onJoin(this.id)">Join</h1>
                </div>

                <div onclick="onLeave()" class="footer buttom leave">
                    <h4 class="buttom-text">LEAVE</h4>
                </div>

                <div id="ReadyButton" onclick="onReady()" class="footer buttom right ready">
                    <h4 class="buttom-text">READY</h4>
                </div>

                <div id="UnReadyButton" onclick="onUnready()" class="footer buttom right ready" style="display: none;">
                    <h4 class="buttom-text">UNREADY</h4>
                </div>

                <div id="startButton" onclick="onStart()" class="footer buttom right start tooltip">
				<span class="tooltiptext">Fee To Start</span>
                    <h4 class="buttom-text">START</h4>
                </div>
            </div>
        </div>
    </body>
</html>
