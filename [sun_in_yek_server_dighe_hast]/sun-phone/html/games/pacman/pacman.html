  <style>
    /* Embedded inside the phone: the game is ALWAYS visible (the phone shows /
       hides it by mounting / unmounting the iframe). Pacman.css hides body /
       #frame / #main by default and only reveals them on a NUI "display" msg,
       which is why the embedded game showed a black screen. These rules load
       AFTER Pacman.css, so they win and the game renders on load.
       We also drop the 160% zoom (CEF ignores it inside an iframe, which made
       the canvas mis-sized) so the canvas renders at its natural 540x484 and
       the phone can scale it to fit. The decorative arcade frame is hidden for
       a clean fit (it wasn't visible anyway). */
    html, body { width: 100%; height: 100%; margin: 0; padding: 0; background: #000; overflow: hidden; }
    /* #main (the canvas) is a CHILD of #frame — so #frame must stay visible,
       otherwise the whole game is hidden. Drop its decorative background image
       and the 160% zoom. #main keeps its top/left:50% + translate centering. */
    body, #frame, #main { display: block !important; }
    #frame { background-image: none !important; position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; }
    #main { zoom: 1 !important; }
    /* The maze is only ~80% of the 540-wide canvas (the left/right margins are
       empty — score & lives sit at the top/bottom). So size the canvas to 120vw
       → the MAZE fills ~96% of the phone width. The empty side margins overflow
       and are clipped (they're black). height:auto keeps the aspect ratio. */
    #main canvas { width: 120vw !important; height: auto !important; display: block; }
  </style>
