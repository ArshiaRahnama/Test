<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- iOS Clock app icon — white face, black ring, classic 10:09 hands.
       Used by HomeComponent via config.json MENUS entry. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f0f4"/>
    </linearGradient>
    <linearGradient id="ringTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <!-- App-icon rounded-square plate (matches iOS corner radius ~22.4%) -->
  <rect x="0" y="0" width="120" height="120" rx="27" ry="27" fill="url(#bg)"/>
  <!-- Subtle top sheen -->
  <rect x="0" y="0" width="120" height="60" rx="27" ry="27" fill="url(#bg)" opacity="0.6"/>
  <!-- Black bezel ring -->
  <circle cx="60" cy="60" r="48" fill="url(#ringTop)"/>
  <!-- White clock face -->
  <circle cx="60" cy="60" r="42" fill="#ffffff"/>
  <!-- Tick marks at 12/3/6/9 -->
  <rect x="58.5" y="18" width="3" height="7" rx="1.5" fill="#0a0a0a"/>
  <rect x="58.5" y="95" width="3" height="7" rx="1.5" fill="#0a0a0a"/>
  <rect x="18" y="58.5" width="7" height="3" rx="1.5" fill="#0a0a0a"/>
  <rect x="95" y="58.5" width="7" height="3" rx="1.5" fill="#0a0a0a"/>
  <!-- Hour hand pointing to 10 -->
  <line x1="60" y1="60" x2="40" y2="42" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  <!-- Minute hand pointing to 2 (10:09) -->
  <line x1="60" y1="60" x2="86" y2="46" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <!-- Red second hand -->
  <line x1="60" y1="60" x2="60" y2="28" stroke="#FF3B30" stroke-width="2" stroke-linecap="round"/>
  <circle cx="60" cy="60" r="3.5" fill="#FF3B30"/>
</svg>
