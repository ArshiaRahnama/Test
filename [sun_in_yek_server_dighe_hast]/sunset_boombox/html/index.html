<!DOCTYPE html>
<html lang="fa" style="background: transparent !important;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunset Boombox</title>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <link rel="stylesheet" type="text/css" href="css/style.css" />
</head>
<body style="background: transparent !important;">
    <div id="boombox" class="boombox-container">
        <div class="boombox-header">
            <div class="boombox-title">
                <span class="icon">🎵</span>
                <h1>BOOMBOX</h1>
            </div>
            <button class="close-btn" onclick="closeBoombox()">✕</button>
        </div>

        <div class="now-playing-card">
            <div class="now-playing-header">
                <span class="playing-icon">♪</span>
                <span>Now Playing</span>
            </div>
            <div class="song-name" id="songName">No song playing</div>
            <div class="progress-container">
                <div class="progress-bar" id="progressBar" onclick="seekTo(event)">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-time">
                    <span id="currentTime">0:00</span>
                    <span id="totalTime">0:00</span>
                </div>
                <div class="cooldown-bar" id="seekCooldown"></div>
            </div>
            <div class="playback-controls">
                <button class="control-btn" id="prevBtn" onclick="prevSong()" title="Previous">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6V6zm3.5 6l8.5 6V6l-8.5 6z"/></svg>
                </button>
                <button class="control-btn play-pause" id="playPauseBtn" onclick="togglePlayPause()" title="Play/Pause">
                    <svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="control-btn" id="nextBtn" onclick="nextSong()" title="Next">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
                <button class="control-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Shuffle">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
                </button>
                <div class="cooldown-bar" id="playbackCooldown"></div>
            </div>
        </div>

        <div class="sliders-grid">
            <div class="slider-card" id="volumeCard">
                <div class="slider-header">
                    <span class="slider-label">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                        Volume
                    </span>
                    <span class="slider-value" id="volumeValue">25%</span>
                </div>
                <input type="range" class="slider-input" id="volumeSlider" min="10" max="100" value="25" oninput="previewVolume(this.value)" onchange="applyVolume(this.value)">
                <div class="cooldown-bar" id="volumeCooldown"></div>
            </div>
            <div class="slider-card" id="rangeCard">
                <div class="slider-header">
                    <span class="slider-label">
                        <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                        Range
                    </span>
                    <span class="slider-value" id="rangeValue">50m</span>
                </div>
                <input type="range" class="slider-input" id="rangeSlider" min="10" max="50" value="50" oninput="previewRange(this.value)" onchange="applyRange(this.value)">
                <div class="cooldown-bar" id="rangeCooldown"></div>
            </div>
        </div>

        <div class="playlist-card">
            <div class="playlist-header">
                <div class="playlist-title">
                    <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
                    <span>Playlist</span>
                </div>
                <button class="add-btn" id="addToPlaylistBtn" onclick="addToPlaylist()" disabled title="Add to Playlist">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
            </div>
            <div class="playlist-items" id="playlistItems">
                <div class="playlist-empty">Playlist khali ast</div>
            </div>
        </div>

        <div class="url-section">
            <input type="text" class="url-input" id="urlInput" placeholder="Link download ahang (mp3/wav)">
            <button class="play-url-btn" onclick="playFromUrl()">
                <svg viewBox="0 0 24 24" fill="currentColor" width="18" height="18"><path d="M8 5v14l11-7z"/></svg>
                <span>Play</span>
            </button>
        </div>

        <button class="exit-btn" onclick="pickupBoombox()">
            <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M10.09 15.59L11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5c-1.11 0-2 .9-2 2v4h2V5h14v14H5v-4H3v4c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
            <span>Exit Boombox</span>
        </button>
    </div>

    <div id="notification" class="notification"></div>

    <div id="carryHint" class="carry-hint">
        <span class="hint-key">E</span>
        <span class="hint-text">Menu Boombox</span>
    </div>

    <script src="js/app.js" type="text/javascript"></script>
</body>
</html>
