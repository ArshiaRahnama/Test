<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Manager</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <!-- Main Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2>Frequency Manager</h2>
                <button class="close-btn" onclick="closeUI()">&times;</button>
            </div>

            <div class="panel-content">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Search frequency..." oninput="filterFrequencies()">
                </div>

                <button class="add-btn" onclick="openAddModal()">
                    <span>+</span> Add Frequency
                </button>

                <div class="freq-list" id="freqList">
                    <!-- Frequencies will be populated here -->
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="editModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Add Frequency</h3>
                    <button class="close-btn" onclick="closeEditModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="freqInput">Frequency Number</label>
                        <input type="number" id="freqInput" placeholder="e.g. 901">
                    </div>
                    <div class="form-group">
                        <label for="accessInput">Access (separate with -)</label>
                        <input type="text" id="accessInput" placeholder="e.g. police-sheriff-fbi">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary" onclick="saveFrequency()">Save</button>
                    <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Delete Confirmation Modal -->
        <div id="deleteModal" class="modal hidden">
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h3>Delete Frequency?</h3>
                    <button class="close-btn" onclick="closeDeleteModal()">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete frequency <strong id="deleteFreqNum"></strong>?</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                    <button class="btn btn-secondary" onclick="closeDeleteModal()">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
