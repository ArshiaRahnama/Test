<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1"/>
    <link rel="stylesheet" href="style.css"/>
    <title>Tattoo Shop</title>
</head>
<body>
    <div id="app" class="hidden">
        <div class="right-side">
            <!-- Category Sidebar -->
            <div class="category-sidebar">
                <div class="sidebar-header">
                    <svg class="shop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 3.5l6 6-2.5 2.5-6-6z"/>
                        <path d="M11.5 6.5l-6.2 6.2a2.6 2.6 0 0 0 0 3.7l2.3 2.3a2.6 2.6 0 0 0 3.7 0L17.5 12.5"/>
                        <line x1="5" y1="19" x2="3" y2="21"/>
                        <circle cx="18" cy="6" r="1"/>
                    </svg>
                </div>
                <div class="category-icons" id="categoriesList"></div>
                <div class="sidebar-footer">
                    <button class="close-btn" onclick="closeShop()">✕</button>
                </div>
            </div>

            <!-- Main Panel -->
            <div class="main-panel">
                <div class="panel-header">
                    <div class="header-right">
                        <span class="category-name" id="currentCategory"><span class="select-arrow">→</span> انتخاب کنید</span>
                        <span class="items-count"><span id="itemsCount">0</span></span>
                    </div>
                    <div class="header-left">
                        <button class="settings-btn" onclick="toggleSettings()" onmouseenter="showTip('تنظیمات', this)" onmouseleave="hideTip()">⚙</button>
                        <div class="rotation-btns">
                            <button class="rotate-btn" data-cam="rotate-left" onmouseenter="showTip('چرخش', this)" onmouseleave="hideTip()">►</button>
                            <button class="rotate-btn" data-cam="rotate-right" onmouseenter="showTip('چرخش', this)" onmouseleave="hideTip()">◄</button>
                            <button class="rotate-btn" onclick="cam('reset')" onmouseenter="showTip('ریست دوربین', this)" onmouseleave="hideTip()">⊙</button>
                        </div>
                    </div>
                </div>

                <div class="items-grid cols-3" id="itemsGrid">
                    <div class="empty-state" id="emptyState">یک دسته‌بندی انتخاب کنید</div>
                </div>

                <div class="selected-info-bar">
                    <span class="selected-name" id="selectedName">-</span>
                    <span class="selected-price" id="selectedPrice">-</span>
                    <button class="action-buy-btn" id="actionBtn" onclick="doAction()" disabled>خرید</button>
                </div>
            </div>
        </div>

        <!-- Settings -->
        <div class="settings-overlay hidden" id="settingsOverlay" onclick="toggleSettings()"></div>
        <div class="settings-panel hidden" id="settingsPanel">
            <div class="settings-header">
                <span class="settings-title">تنظیمات نمایش</span>
                <button class="settings-close" onclick="toggleSettings()">✕</button>
            </div>
            <div class="settings-section">
                <span class="settings-label">تعداد ستون‌ها</span>
                <div class="settings-grid-selector">
                    <button class="settings-grid-btn" data-cols="4" onclick="setCols(4)">4</button>
                    <button class="settings-grid-btn active" data-cols="3" onclick="setCols(3)">3</button>
                    <button class="settings-grid-btn" data-cols="2" onclick="setCols(2)">2</button>
                    <button class="settings-grid-btn" data-cols="1" onclick="setCols(1)">1</button>
                </div>
            </div>
        </div>

        <div class="global-tooltip" id="globalTooltip"></div>
        <div class="notification-container" id="notificationContainer"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
