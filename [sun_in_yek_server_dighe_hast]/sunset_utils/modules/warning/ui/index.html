<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هشدار</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="warning-box">
        <div class="warning-icon">⚠</div>
        <h2 class="warning-title">هشدار</h2>
        <p id="warning-text">در حال بارگذاری...</p>
        <div class="hold-instruction">
            برای بستن، دکمهٔ <span class="key">Space</span> را
            <span id="duration-label">۱۰</span> ثانیه نگه دارید
        </div>
        <div class="progress-track">
            <div id="progress-fill"></div>
        </div>
        <div class="progress-label-row">
            <span id="progress-label">۰٪</span>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
