<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ثبت کاراکتر</title>
    <link href="css/style.css" rel="stylesheet" type="text/css">
</head>
<body>
    <div class="container">
        <div class="register-card">
            <!-- Header -->
            <div class="card-header">
                <div class="logo">
                    <div class="logo-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>
                </div>
                <h1>ساخت کاراکتر</h1>
                <p>اطلاعات کاراکتر خود را وارد کنید</p>
            </div>

            <!-- Form -->
            <form id="register" name="register" autocomplete="off">
                <div class="form-group">
                    <label for="firstname">نام</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                        <input
                            id="firstname"
                            type="text"
                            name="firstname"
                            placeholder="نام خود را وارد کنید"
                            pattern="[a-zA-Z]+"
                            lang="en"
                            required
                            maxlength="10"
                        >
                    </div>
                    <span class="input-hint">فقط حروف انگلیسی</span>
                </div>

                <div class="form-group">
                    <label for="lastname">نام خانوادگی</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                        <input
                            id="lastname"
                            type="text"
                            name="lastname"
                            placeholder="نام خانوادگی خود را وارد کنید"
                            pattern="[a-zA-Z]+"
                            lang="en"
                            maxlength="10"
                            required
                        >
                    </div>
                    <span class="input-hint">فقط حروف انگلیسی</span>
                </div>

                <button id="submit" type="submit">
                    <span>ایجاد کاراکتر</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7"></path>
                    </svg>
                </button>
            </form>

            <!-- Footer -->
            <div class="card-footer">
                <p>ماجراجویی شما از اینجا شروع می‌شود</p>
            </div>
        </div>

        <!-- Notification -->
        <div id="notification" class="notification hidden">
            <span id="notificationText"></span>
        </div>
    </div>

    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="js/script.js" type="text/javascript"></script>
</body>
</html>
