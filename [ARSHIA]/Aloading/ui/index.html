<audio id="myaudio" autoplay>

</audio>

    <script src="config.js"></script>
    <script src="app.js"></script>
	 <script>
        var myaudio = document.getElementById("myaudio");
        var rndIntmusic = Math.floor(Math.random() * 5) + 1
          myaudio.src = `music/${rndIntmusic}.mp3`;
          myaudio.volume = 0.4;
          myaudio.load();
          myaudio.play();
        var state = true

        document.addEventListener("keydown", function (e) {
            if (e.keyCode == 32) {
                if (state) {
                    state = false;
                    myaudio.volume = 0.0;
                } else {
                    state = true;
                    myaudio.volume = 0.4;
                }
            }
        });
    </script>
