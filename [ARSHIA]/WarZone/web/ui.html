<!doctype html>
<html lang="fa">
<head>
	<meta charset="UTF-8">
	<title>AlaviOne</title>
	<meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=10" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Fredoka+One&family=Mulish:wght@200&display=swap"
        rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"
        integrity="sha512-894YE6QWD5I59HgZOGReFYm4dnWc1Qt5NtvYSaNcOP+u1T9qYdvdihz0PPSiiqn/+/3e7Jo4EaG7TubfWGUrMQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>	
		<script src="js/script.js" type="text/javascript"></script>
</head>
<body style="display: block;">
	<div class="Winner" id = Winner  style="display: none;"> <span> Victory Royal </span> <img src="img/island.png"> 
		<p  id = p1 style="display: inline"> </p>  
		<p  id = p2 style="display: inline">  </p>  
		<p  id = p3 style="display: inline">  </p>  
		<p  id = p4 style="display: inline">  </p>  
		<i class="fas fa-star"></i>

	</div>
         <div class="LobbeyMenu" id = 'LobbeyMenu' style="display: none;">
			<img src="img/Lobbey.png"> 
			<div class="exit" id =exit ><button class="fas fa-window-close exitfinger"> </button></div>
			<div class="logo"> <img src="img/logo.png"></div>
			<div class="StartMenu"> 
			<div class="start"   id ='start' >	
				<button  class="startbtn" > PLAY</button>
			</div>
			<div class="map"  >	
				 <img  src="img/island.png">
			</div>
		</div>
	
		</div>
		<div class="InGame" id = InGame  style="display: none;"> 
			<div class="MyShield">  <img src="img/armor.png"> <p id ="MyShield"> 2 </p> <span> Y </span> </div>
			<div class="MyShield MyUav" >  <img src="img/uav.png"> <p id = "MyUav"> 0 </p> <span> Q </span> </div>
			<div class="MyShield MyBandage">  <img src="img/bandage.png"> <p id = "MyBandage"> 2 </p><span> U </span> </div>
			<div class="MySelf">  <img src="img/self.png"> <p id = "MySelf"> 0 </p> </div>
			<div class="Info">
				<p> <i class="fas fa-users"></i><span id ='Squads'>0</span></p> 
				<p class="Alive"> <i class="fas fa-user-alt"></i><span id ='Alive'>0</span></p>
				<p class="Kill"> <i class="fas fa-skull"></i><span id ='MyKill'>0</span></p>
			
			</div>
		<div class="PlayerBox">
			<div class="ShowPlayerOne"  id = ShowPlayerOne  style="display:none ;">
				<div class="Player p1" style="display:inline-block;">
					<div class="Name fas fa-star"> <p  id ='Namep1' style="display:inline;">Loading</p></div>
					<div class="health"> <div  id = 'healp1' class="MyHealth 	fas fa-heartbeat"  style="font-size: 65%;display: inline;text-align: center; color: rgb(241, 18, 18);"></div></div>
					<div class="health armor"><div id = 'armorp1'  class="MyArmor fas fa-shield-alt"  style="font-size: 65%;display: inline;text-align: center; color: white;"></div></div>
				</div>
			</div>
			<div class="ShowPlayerTwo" id = ShowPlayerTwo style="display:none ;">
				<div class="Player p2" style="display:inline-block;">
					<div class="Name fas fa-star"> <p id ='Namep2'  style="display:inline;">Loading</p></div>
					<div class="health"> <div id = 'healp2' class="MyHealth 	fas fa-heartbeat"  style="font-size: 65%;display: inline;text-align: center; color: rgb(241, 18, 18);"></div></div>
					<div class="health armor"><div id = 'armorp2' class="MyArmor fas fa-shield-alt"  style="font-size: 65%;display: inline;text-align: center; color: white;"></div></div>
				</div>
			</div>
			<div class="ShowPlayerthree" id = ShowPlayerthree style="display:none ;">
				<div class="Player p3" style="display:inline-block;">
					<div class="Name fas fa-star"> <p id ='Namep3'  style="display:inline;">Loading</p> </div>
					<div class="health"> <div id = 'healp3' class="MyHealth 	fas fa-heartbeat"  style="font-size: 65%;display: inline;text-align: center; color: rgb(241, 18, 18);"></div></div>
					<div class="health armor"><div id = 'armorp3' class="MyArmor fas fa-shield-alt"  style="font-size: 65%;display: inline;text-align: center; color: white;"></div></div>
				</div>
			</div>
			</div>
			<div class="Player MyBox">
				<div class="Name fas fa-star"> <p id ='MyName' style="display:inline;">Loading</p><p id ='Cash' style="display:inline;"> - 0 $</p> </div>
				<div class="health"> <div id = 'myheal' class="MyHealth 	fas fa-heartbeat"  style="font-size: 65%;display: inline;text-align: center; color: rgb(241, 18, 18);"></div></div>
				<div class="health armor"><div id = 'myarmor'  class="MyArmor fas fa-shield-alt"  style="font-size: 65%;display: inline;text-align: center; color: white;"></div></div>
			</div>
			<div class="KilMassge" id ='KilMassge' style="display: none;"><p style="display:inline;" id = 'killer'> ... </p> <img src="img/killphoto.png"> <span class="killed" style="display:inline;" id = 'killed'> ... </span> </div>
			<div class="SpectatorBar" id="SpectatorBar" style="display:none; position:fixed; top:20px; left:50%; transform:translate(-50%,0); background:rgba(0,0,0,0.72); color:#fff; padding:8px 22px; border-radius:8px; font-family:'Open Sans',sans-serif; font-size:14px; z-index:9998;">
				Spectating: <b id="SpectatorName">-</b> &nbsp;|&nbsp; [←/→] switch &nbsp;|&nbsp; [Backspace] leave
			</div>
		</div>
		<div class="AdminPanel" id="AdminPanel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:rgba(15,15,18,0.96); padding:22px 26px; border-radius:10px; color:#fff; width:300px; font-family:'Open Sans',sans-serif; z-index:9999; box-shadow:0 0 25px rgba(0,0,0,0.6);">
			<h2 style="margin:0 0 12px 0; font-size:18px;">🔫 WarZone Admin</h2>
			<p id="AdminPanelStatus" style="font-size:13px; opacity:0.8; margin-bottom:14px;">Loading...</p>
			<div id="AdminPanelOpenLobby" style="display:none;">
				<button id="adminOpenLobbyBtn" style="width:100%; padding:10px; border:none; border-radius:6px; background:#0d57f7; color:#fff; font-weight:bold; cursor:pointer;">Open Lobby</button>
			</div>
			<div id="AdminPanelStartForm" style="display:none;">
				<label style="font-size:12px; opacity:0.8;">Blood (lives)</label>
				<input type="number" id="apBlood" value="3" min="1" max="10" style="width:100%; margin-bottom:8px; padding:6px; border-radius:4px; border:none;">
				<label style="font-size:12px; opacity:0.8;">Zone time (minutes)</label>
				<input type="number" id="apTime" value="8" min="1" max="30" style="width:100%; margin-bottom:8px; padding:6px; border-radius:4px; border:none;">
				<label style="font-size:12px; opacity:0.8;">Map</label>
				<select id="apMap" style="width:100%; margin-bottom:8px; padding:6px; border-radius:4px; border:none;">
					<option value="SANDY">Sandy Shores</option>
					<option value="ISLAND">Island</option>
				</select>
				<label style="font-size:12px; opacity:0.8;">Team size</label>
				<select id="apTeam" style="width:100%; margin-bottom:10px; padding:6px; border-radius:4px; border:none;">
					<option value="1">Solo</option>
					<option value="2" selected>Duo</option>
					<option value="3">Trio</option>
					<option value="4">Squad</option>
				</select>
				<button id="adminStartBtn" style="width:100%; padding:10px; border:none; border-radius:6px; background:#c0392b; color:#fff; font-weight:bold; cursor:pointer;">Start Match</button>
			</div>
			<button id="adminPanelCloseBtn" style="width:100%; padding:8px; margin-top:12px; border:none; border-radius:6px; background:#333; color:#fff; cursor:pointer;">Close</button>
		</div>
	<script src="js/script.js" type="text/javascript"></script>
</body>
</html>
