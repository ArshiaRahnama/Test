<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WarZone</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; }
  #feed { position: fixed; top: 70px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .kill {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px;
    background: rgba(10, 10, 14, .78); border-right: 3px solid #e63946; border-radius: 4px;
    color: #fff; font-size: 15px; font-weight: 600; letter-spacing: .3px;
    animation: in .25s ease-out; transition: opacity .5s, transform .5s;
  }
  .kill.out { opacity: 0; transform: translateX(30px); }
  .killer { color: #ff4d5a; }
  .victim { color: #fff; }
  .weapon { color: #c9c9d1; font-size: 12px; padding: 2px 7px; background: rgba(255,255,255,.1); border-radius: 3px; text-transform: uppercase; }
  .head { color: #ffd166; font-size: 12px; }
  @keyframes in { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="feed"></div>
<script>
  (function () {
    var feed = document.getElementById('feed');
    var MAX = 6, LIFE = 6000;
    function esc(s) { var d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.action !== 'wzAddKill') return;
      var row = document.createElement('div');
      row.className = 'kill';
      row.innerHTML = '<span class="killer">' + esc(d.killer) + '</span>' +
        '<span class="weapon">' + esc(d.weapon) + '</span>' +
        (d.head ? '<span class="head">HS</span>' : '') +
        '<span class="victim">' + esc(d.killed) + '</span>';
      feed.insertBefore(row, feed.firstChild);
      while (feed.children.length > MAX) feed.removeChild(feed.lastChild);
      setTimeout(function () { row.classList.add('out'); setTimeout(function () { if (row.parentNode) row.parentNode.removeChild(row); }, 500); }, LIFE);
    });
  })();
</script>
</body>
</html>
