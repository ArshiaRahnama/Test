<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Voice Indicator</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    #mic-wrap {
      position: fixed;
      bottom: 3vh;
      left: 50%;
      transform: translateX(-50%) scale(0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      opacity: 0;
      transition: opacity 0.35s ease, transform 0.35s ease;
      pointer-events: none;
    }

    #mic-wrap.visible {
      opacity: 1;
      transform: translateX(-50%) scale(1);
    }

    /* بج شیشه‌ای پشت آیکون */
    #mic-badge {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(24, 27, 32, 0.55);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 0 0 0 rgba(76, 217, 100, 0);
      transition: box-shadow 0.4s ease, border-color 0.4s ease;
    }

    /* حلقه‌ی درخشان دور بج، فقط وقتی حرف می‌زنی دیده میشه */
    #mic-badge::after {
      content: "";
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(76, 217, 100, 0);
      transition: border-color 0.4s ease;
    }

    #mic-wrap.talking #mic-badge {
      border-color: rgba(76, 217, 100, 0.35);
      box-shadow: 0 0 16px 2px rgba(76, 217, 100, 0.45);
    }

    #mic-wrap.talking #mic-badge::after {
      border-color: rgba(76, 217, 100, 0.55);
      animation: micPulse 1.1s ease-out infinite;
    }

    @keyframes micPulse {
      0%   { transform: scale(1);    opacity: 0.8; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    #mic-icon {
      position: relative;
      width: 20px;
      height: 20px;
      z-index: 1;
      filter: brightness(0) saturate(100%) invert(46%) sepia(3%) saturate(300%) hue-rotate(180deg) brightness(85%);
      transition: filter 0.3s ease;
    }

    #mic-wrap.talking #mic-icon {
      filter: brightness(0) saturate(100%) invert(72%) sepia(46%) saturate(555%) hue-rotate(70deg) brightness(97%) contrast(92%);
    }
  </style>
</head>
<body>
  <div id="mic-wrap">
    <div id="mic-badge"></div>
    <img id="mic-icon" src="img/microphone.png">
  </div>

  <script>
    var micWrap = document.getElementById('mic-wrap');
    var hideTimer = null;

    window.addEventListener('message', function (event) {
      var item = event.data;
      if (!item || item.id !== 'hud' || item.event !== 'setData') return;
      if (item.talking === undefined) return;

      micWrap.classList.add('visible');
      micWrap.classList.toggle('talking', !!item.talking);

      clearTimeout(hideTimer);
      if (!item.talking) {
        hideTimer = setTimeout(function () {
          micWrap.classList.remove('visible');
        }, 2500);
      }
    });
  </script>
</body>
</html>
