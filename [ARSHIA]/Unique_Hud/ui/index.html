  <script>
    // ✅ اضافه شد: چون پنل اسکوربورد تو یه iframe عمیقه، حتی وقتی کیبورد
    // قبضه می‌شه، فوکوس واقعی رو همین صفحه‌ی اصلیه - Esc رو همینجا می‌گیریم.
    var uhScoreboardIsOpen = false;
    document.addEventListener('keyup', function (e) {
      if (e.key === 'Escape' && uhScoreboardIsOpen) {
        fetch('https://' + GetParentResourceName() + '/closeScoreboardUniqueHud', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        }).catch(function () {});
      }
    });

    // پل بین صفحه‌ی اصلی و iframeهای ماژول‌های ادغام‌شده. SendNUIMessage فقط
    // به پنجره‌ی اصلی می‌رسه، پس هر پیام رو بر اساس شکلش به iframe درستش پاس می‌دیم.
    window.addEventListener('message', function (event) {
      var item = event.data;
      if (!item) return;

      if (item.type === 'streetLabel:MSG') {
        var slFrame = document.getElementById('streetlabel-frame');
        if (slFrame && slFrame.contentWindow) {
          slFrame.contentWindow.postMessage(item, '*');
        }
      } else if (item.action === 'new' || item.action === 'hide') {
        // کامبت‌مود: هم 'hide' با ماژول سرعت‌سنج مشترکه، ولی چون فیلد
        // 'action' اونجا مقادیر دیگه‌ای (speedo:...) داره تداخلی پیش نمیاد.
        var cbFrame = document.getElementById('combat-frame');
        if (cbFrame && cbFrame.contentWindow) {
          cbFrame.contentWindow.postMessage(item, '*');
        }
      } else if (item.type === 'updateVehicleHud' || item.type === 'initSpeedUnit') {
        var spFrame = document.getElementById('speedometer-frame');
        if (spFrame && spFrame.contentWindow) {
          spFrame.contentWindow.postMessage(item, '*');
        }
      } else if (item.id === 'scoreboard' && item.event === 'requestClose') {
        // این پیام از داخل iframe تودرتوی اسکوربورد میاد (دکمه‌ی ✕).
        // GetParentResourceName داخل اون iframe کار نمی‌کرد، پس همین‌جا
        // (سطح بالا) که قابل‌اعتماده انجامش می‌دیم.
        fetch('https://' + GetParentResourceName() + '/closeScoreboardUniqueHud', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({}),
        }).catch(function () {});
      } else if (item.id === 'scoreboard') {
        if (item.event === 'toggle') {
          uhScoreboardIsOpen = !!item.open;
        }
        var sbFrame = document.getElementById('scoreboard-frame');
        if (sbFrame && sbFrame.contentWindow) {
          sbFrame.contentWindow.postMessage(item, '*');
        }
      } else if (item.displayWindow !== undefined) {
        var sbeltFrame = document.getElementById('seatbelt-frame');
        if (sbeltFrame && sbeltFrame.contentWindow) {
          sbeltFrame.contentWindow.postMessage(item, '*');
        }
      } else if (item.id === 'hud') {
        var hud2Frame = document.getElementById('hud2-frame');
        if (hud2Frame && hud2Frame.contentWindow) {
          hud2Frame.contentWindow.postMessage(item, '*');
        }
      }
    });
  </script>
<!-- Street label (از sun-streetlabel ادغام شد) - صفحه‌ی خودش رو داخل یه iframe
     شفاف نگه می‌داره چون CSS/JS اون کاملاً مستقله و ادغام دستی داخل همین صفحه
     ریسک به‌هم‌ریختن استایل HUD اصلی رو داشت. -->
<iframe id="streetlabel-frame" src="streetlabel/index.html"
