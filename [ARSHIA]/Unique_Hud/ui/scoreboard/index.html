<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Scoreboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="sb-wrap">
    <div id="sb-panel">
      <div class="sb-header">
        <span class="sb-title">UNIQUE</span>
        <span class="sb-sub">Scoreboard</span>
        <span id="sb-players" class="sb-players">0 / 0</span>
      </div>

      <div class="sb-section">
        <div class="sb-section-title">شغل‌ها</div>
        <div id="sb-jobs" class="sb-grid"></div>
      </div>

      <div class="sb-section">
        <div class="sb-section-title">گنگ‌ها</div>
        <div id="sb-gangs" class="sb-grid"></div>
      </div>

      <div class="sb-section">
        <div class="sb-section-title">وضعیت دزدی‌ها</div>
        <div id="sb-robs" class="sb-grid"></div>
      </div>

      <div class="sb-section">
        <div class="sb-section-title">ادمین‌های آنلاین (<span id="sb-admin-count">0</span>)</div>
        <div id="sb-admins" class="sb-admin-list"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
