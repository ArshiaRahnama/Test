<html>
  <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <style>
      #wrap {
        width: 460px !important;
        height: auto !important;
        max-height: 75vh;
        overflow-y: auto;
        padding-bottom: 10px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55) !important;
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.96);
        transition: opacity 180ms ease, transform 180ms ease;
      }
      #wrap.uh-visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      .LogoBox img {
        height: 80px !important;
      }
      .InfoBox h1 {
        font-size: 12px;
      }
      .InfoBox h2 {
        font-size: 24px;
      }
      #close_btn {
        position: absolute;
        top: 10px;
        left: 14px;
        background: #ff3547;
        color: #fff;
        border: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        box-shadow: 0 0 8px rgba(255, 53, 71, 0.5);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }
      #close_btn:hover {
        transform: scale(1.12);
        box-shadow: 0 0 14px rgba(255, 53, 71, 0.8);
      }

      .stats-row {
        display: flex;
        gap: 16px;
      }
      .stat-block {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .org-list {
        clear: both;
        padding: 10px 20px 5px 20px;
      }
      .org-card {
        background: var(--ColorThree);
        border-radius: 10px;
        margin-bottom: 6px;
        overflow: hidden;
        transition: 300ms;
        border: 1px solid transparent;
      }
      .org-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-family: 'Gluten', cursive;
        transition: background 150ms ease;
      }
      .org-header:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .org-card.expanded {
        border-color: rgba(196, 163, 0, 0.35);
      }
      .org-header .org-title {
        font-size: 13px;
        color: var(--textcolor);
      }
      .org-header .org-count {
        font-size: 12px;
        color: #c4a300;
        font-weight: bold;
      }
      .org-header .org-arrow {
        transition: 300ms;
        margin-right: 6px;
        color: #9ca3af;
        display: inline-block;
      }
      .org-card.expanded .org-arrow {
        transform: rotate(90deg);
        color: #c4a300;
      }
      .org-jobs {
        max-height: 0;
        overflow: hidden;
        transition: max-height 300ms ease;
      }
      /* ✅ آکاردئون: فقط یه ارگان هم‌زمان باز می‌مونه (نه هر سه‌تا)، پس پنل
         کشیده و بلند نمی‌شه، شکلش جمع‌وجورتر (نزدیک‌تر به مربع) می‌مونه. */
      .org-card.expanded .org-jobs {
        max-height: 260px;
      }
      .org-job-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 18px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        transition: background 150ms ease;
      }
      .org-job-row:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .org-job-row .count-badge {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 1px 8px;
        font-weight: bold;
        transition: background 150ms ease, color 150ms ease;
      }
      .org-job-row.online .count-badge {
        background: #c4a300;
        color: #1a1a1a;
      }
    </style>
    <title>Scoreboard</title>
  </head>

  <body>
    <div style="display: none; position: relative;" id="wrap">
      <button id="close_btn" onclick="requestClose()">✕</button>

      <div class="container" id="container">

        <div class="RightSide">
          <div class="LogoBox">
            <img src="images/Assets/silver_logo.png">
          </div>

          <div class="InfoBox">
            <div class="stats-row">
              <div class="stat-block">
                <h1>Players</h1>
                <h2><span id="playersnum">0</span></h2>
              </div>
              <div class="stat-block">
                <h1>Admins</h1>
                <h2><span id="adminsnum">0</span></h2>
              </div>
            </div>
          </div>

        </div>

        <div class="org-list" id="org-list"></div>

      </div>
    </div>

    <script src="js/main.js" type="text/javascript"></script>
  </body>
</html>
