<html>
  <head>
    <link href="https://fonts.googleapis.com/css2?family=Gluten&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
      /* ✅ کاملاً مستقل: هیچ کلاس/آیدی از css/index.css قدیمی (LogoBox/RightSide/
         InfoBox/container/#wrap) استفاده نشده - اون‌ها یه انیمیشن+float داشتن
         که هر بار به‌طرز عجیبی باعث یه فضای خالی بزرگ زیر پنل می‌شد. */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: 'Quicksand', sans-serif;
      }

      #uh-sb-wrap {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0.96);
        width: 420px;
        max-height: 70vh;
        overflow-y: auto;
        background: #26222dcc;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
        color: #fff;
        opacity: 0;
        transition: opacity 180ms ease, transform 180ms ease;
      }
      #uh-sb-wrap.uh-visible {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }

      #uh-sb-inner {
        padding: 18px;
        position: relative;
      }

      #uh-close-btn {
        position: absolute;
        top: 8px;
        left: 10px;
        background: #ff3547;
        color: #fff;
        border: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        box-shadow: 0 0 8px rgba(255, 53, 71, 0.5);
        transition: transform 150ms ease, box-shadow 150ms ease;
      }
      #uh-close-btn:hover {
        transform: scale(1.12);
        box-shadow: 0 0 14px rgba(255, 53, 71, 0.8);
      }

      #uh-sb-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 14px;
      }
      #uh-sb-header img {
        height: 60px;
        margin-bottom: 8px;
      }
      #uh-sb-stats {
        display: flex;
        gap: 26px;
      }
      .uh-stat {
        text-align: center;
      }
      .uh-stat .uh-stat-label {
        font-size: 11px;
        color: #9ca3af;
      }
      .uh-stat .uh-stat-value {
        font-size: 22px;
        font-weight: 700;
      }

      .org-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid transparent;
        border-radius: 10px;
        margin-bottom: 6px;
        overflow: hidden;
        transition: border-color 200ms ease;
      }
      .org-card.expanded {
        border-color: rgba(196, 163, 0, 0.35);
      }
      .org-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-family: 'Gluten', cursive;
        transition: background 150ms ease;
      }
      .org-header:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .org-header .org-title {
        font-size: 13px;
        color: #fff;
      }
      .org-header .org-count {
        font-size: 12px;
        color: #c4a300;
        font-weight: bold;
      }
      .org-header .org-arrow {
        transition: transform 200ms ease, color 200ms ease;
        margin-right: 6px;
        color: #9ca3af;
        display: inline-block;
      }
      .org-card.expanded .org-arrow {
        transform: rotate(90deg);
        color: #c4a300;
      }
      .org-jobs {
        max-height: 0;
        overflow: hidden;
        transition: max-height 300ms ease;
      }
      .org-card.expanded .org-jobs {
        max-height: 260px;
      }
      .org-job-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 18px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        transition: background 150ms ease;
      }
      .org-job-row:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .org-job-row .count-badge {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 1px 8px;
        font-weight: bold;
        transition: background 150ms ease, color 150ms ease;
      }
      .org-job-row.online .count-badge {
        background: #c4a300;
        color: #1a1a1a;
      }
    </style>
    <title>Scoreboard</title>
  </head>

  <body>
    <div id="uh-sb-wrap">
      <div id="uh-sb-inner">
        <button id="uh-close-btn" onclick="requestClose()">✕</button>

        <div id="uh-sb-header">
          <img src="images/Assets/silver_logo.png">
          <div id="uh-sb-stats">
            <div class="uh-stat">
              <div class="uh-stat-label">Players</div>
              <div class="uh-stat-value" id="playersnum">0</div>
            </div>
            <div class="uh-stat">
              <div class="uh-stat-label">Admins</div>
              <div class="uh-stat-value" id="adminsnum">0</div>
            </div>
          </div>
        </div>

        <div id="org-list"></div>
      </div>
    </div>

    <script src="js/main.js" type="text/javascript"></script>
  </body>
</html>
