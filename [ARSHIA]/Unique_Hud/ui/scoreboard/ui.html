<html>
  <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="css/index.css?v=3" />
    <style>
      /* ✅ بازطراحی کامل: به‌جای override کردن #wrap/.container قدیمی (که به
         هر دلیلی هربار یه‌جوری دور زده می‌شد)، یه پنل کاملاً جدا و مستقل با
         کلاس‌های خودمون ساختیم - صفر تداخل با CSS قدیمی. */
      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
      #uh-sb-wrap {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 420px;
        max-height: 70vh;
        overflow-y: auto;
        background: var(--ColorTwo, rgba(30, 28, 36, 0.92));
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        color: #fff;
        font-family: 'Quicksand', sans-serif;
      }
      #uh-sb-inner {
        padding: 20px;
        position: relative;
      }
      #uh-close-btn {
        position: absolute;
        top: 8px;
        left: 10px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: none;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
        line-height: 1;
        z-index: 5;
      }
      #uh-close-btn:hover {
        background: #ff3547;
      }
      #uh-sb-header {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-bottom: 16px;
      }
      #uh-sb-header img {
        height: 64px;
        margin-bottom: 8px;
      }
      #uh-sb-stats {
        display: flex;
        gap: 24px;
      }
      .uh-stat {
        text-align: center;
      }
      .uh-stat .uh-stat-label {
        font-size: 11px;
        color: #9ca3af;
      }
      .uh-stat .uh-stat-value {
        font-size: 22px;
        font-weight: 700;
      }

      .org-card {
        background: var(--ColorThree, rgba(255,255,255,0.06));
        border-radius: 10px;
        margin-bottom: 6px;
        overflow: hidden;
      }
      .org-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 14px;
        cursor: pointer;
        font-family: 'Gluten', cursive;
      }
      .org-header .org-title {
        font-size: 13px;
        color: #fff;
      }
      .org-header .org-count {
        font-size: 12px;
        color: #c4a300;
        font-weight: bold;
      }
      .org-header .org-arrow {
        transition: 300ms;
        margin-right: 6px;
        color: #9ca3af;
        display: inline-block;
      }
      .org-card.expanded .org-arrow {
        transform: rotate(90deg);
      }
      .org-jobs {
        max-height: 0;
        overflow: hidden;
        transition: max-height 300ms ease;
      }
      .org-card.expanded .org-jobs {
        max-height: 260px;
      }
      .org-job-row {
        display: flex;
        justify-content: space-between;
        padding: 6px 18px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.8);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .org-job-row .count-badge {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 1px 8px;
        font-weight: bold;
      }
      .org-job-row.online .count-badge {
        background: #c4a300;
        color: #1a1a1a;
      }
    </style>
    <title>Scoreboard</title>
  </head>

  <body>
    <div id="uh-sb-wrap">
      <div id="uh-sb-inner">
        <button id="uh-close-btn" onclick="requestClose()">✕</button>

        <div id="uh-sb-header">
          <img src="images/Assets/silver_logo.png">
          <div id="uh-sb-stats">
            <div class="uh-stat">
              <div class="uh-stat-label">Players</div>
              <div class="uh-stat-value" id="playersnum">0</div>
            </div>
            <div class="uh-stat">
              <div class="uh-stat-label">Admins</div>
              <div class="uh-stat-value" id="adminsnum">0</div>
            </div>
          </div>
        </div>

        <div id="org-list"></div>
      </div>
    </div>

    <script src="js/main.js?v=3" type="text/javascript"></script>
  </body>
</html>
