<html>
  <head>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="css/index.css" />
    <style>
      #wrap {
        width: 560px !important;
        height: auto !important;
        max-height: 80vh;
        overflow-y: auto;
        padding-bottom: 10px;
      }
      .LogoBox img {
        height: 90px !important;
      }
      .InfoBox h1 {
        font-size: 13px;
      }
      .InfoBox h2 {
        font-size: 26px;
      }
      #close_btn {
        position: absolute;
        top: 10px;
        left: 14px;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 15px;
        line-height: 1;
      }
      #close_btn:hover {
        background: #ff3547;
      }

      .org-list {
        clear: both;
        padding: 10px 25px 5px 25px;
      }
      .org-card {
        background: var(--ColorThree);
        border-radius: 10px;
        margin-bottom: 8px;
        overflow: hidden;
        transition: 300ms;
      }
      .org-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 16px;
        cursor: pointer;
        font-family: 'Gluten', cursive;
      }
      .org-header .org-title {
        font-size: 15px;
        color: var(--textcolor);
      }
      .org-header .org-count {
        font-size: 13px;
        color: #c4a300;
        font-weight: bold;
      }
      .org-header .org-arrow {
        transition: 300ms;
        margin-right: 8px;
        color: #9ca3af;
        display: inline-block;
      }
      .org-card.expanded .org-arrow {
        transform: rotate(90deg);
      }
      .org-jobs {
        max-height: 0;
        overflow: hidden;
        transition: max-height 300ms ease;
      }
      .org-card.expanded .org-jobs {
        max-height: 300px;
      }
      .org-job-row {
        display: flex;
        justify-content: space-between;
        padding: 8px 20px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.8);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .org-job-row .count-badge {
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 1px 9px;
        font-weight: bold;
      }
      .org-job-row.online .count-badge {
        background: #c4a300;
        color: #1a1a1a;
      }
    </style>
    <title>Scoreboard</title>
  </head>

  <body>
    <div style="display: none; position: relative;" id="wrap">
      <button id="close_btn" onclick="requestClose()">✕</button>

      <div class="container" id="container">

        <div class="RightSide">
          <div class="LogoBox">
            <img src="images/Assets/silver_logo.png">
          </div>

          <div class="InfoBox">
            <h1>Players</h1>
            <h2><span id="playersnum">0</span></h2>
          </div>

        </div>

        <div class="org-list" id="org-list"></div>

      </div>
    </div>

    <!-- ✅ فیکس شد: اسکریپت آخرِ body قرار گرفت (نه تو head مثل قبل)، چون
         document.getElementById('org-list') قبل از این‌که خودِ اون div لود
         بشه صدا زده می‌شد و کرش می‌کرد (Cannot set properties of null) -
         دقیقاً همون خطایی که می‌دیدی. -->
    <script src="js/main.js" type="text/javascript"></script>
  </body>
</html>
