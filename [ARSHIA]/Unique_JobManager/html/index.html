<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Unique Job Manager</title>
<style>
@font-face{font-family:"Audiowide";src:url("Audiowide.ttf")}
:root{--gold:#d4af37;--gold2:#f6dd8a;--gold3:#8f6f12;--ink:#0a0b10;--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.085);--line:rgba(212,175,55,.26);--green:#3ddc84;--red:#ff4d5e;--blue:#5ab0ff;--txt:#f2ecd9}
*{box-sizing:border-box;font-family:"Audiowide",system-ui,sans-serif;letter-spacing:.3px}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;color:var(--txt)}
#app{display:none;position:fixed;inset:0;align-items:center;justify-content:center}
#app.on{display:flex}
.win{width:min(1240px,94vw);height:min(720px,90vh);display:grid;grid-template-columns:250px 1fr;border-radius:26px;border:1px solid var(--line);
 background:radial-gradient(1200px 500px at 70% -10%,rgba(212,175,55,.10),transparent 60%),linear-gradient(160deg,rgba(14,15,22,.97),rgba(8,9,13,.97));
 box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(212,175,55,.07) inset;overflow:hidden;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
aside{border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.sech{color:var(--gold);font-size:15px;text-align:center;padding:6px 0 10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--txt);cursor:pointer;font-size:13px;transition:.18s;text-align:left}
.navbtn:hover{background:var(--glass2);transform:translateX(3px)}
.navbtn.on{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#1a1405;border-color:var(--gold2)}
.navbtn .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none}
.navbtn.off .dot{background:var(--red);box-shadow:0 0 8px var(--red)}
.navbtn .cnt{margin-left:auto;font-size:11px;opacity:.7}
#orgList{display:flex;flex-direction:column;gap:7px;overflow:auto;min-height:0;padding-right:4px}
#orgList::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:6px}
#orgList::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:var(--gold3);border-radius:6px}
.dept{font-size:10px;color:var(--gold);opacity:.8;margin:8px 4px 0;text-transform:uppercase}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{display:flex;align-items:center;gap:14px;padding:16px 24px;border-bottom:1px solid var(--line)}
.logo{font-size:22px;color:var(--gold);text-shadow:0 0 18px rgba(212,175,55,.45)}
.logo small{display:block;font-size:10px;color:var(--gold2);opacity:.75;margin-top:2px}
.sp{flex:1}
.x{width:38px;height:38px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:20px;cursor:pointer;transition:.18s}
.x:hover{background:var(--gold);color:#111;transform:rotate(90deg)}
.content{flex:1;min-height:0;padding:18px 24px;display:flex;flex-direction:column;gap:14px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.card b{display:block;font-size:30px;color:var(--gold2)}
.card span{font-size:11px;opacity:.7}
.hint{border:1px dashed var(--line);border-radius:16px;padding:14px 16px;font-size:12px;line-height:1.9;color:#e8dfc2;background:var(--glass)}
.hint i{color:var(--gold);font-style:normal}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{padding:8px 16px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--txt);cursor:pointer;font-size:12px;transition:.15s}
.tab:hover{background:var(--glass2)}
.tab.on{background:linear-gradient(135deg,var(--gold),var(--gold3));color:#1a1405;border-color:var(--gold2)}
.tab em{font-style:normal;opacity:.65;margin-left:6px;font-size:10px}
.bar{display:flex;gap:10px;align-items:center}
.inp{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--txt);font-size:12px;outline:none}
.inp:focus{border-color:var(--gold)}
.btn{padding:10px 16px;border-radius:12px;border:1px solid var(--gold2);background:linear-gradient(135deg,var(--gold),var(--gold3));color:#1a1405;cursor:pointer;font-size:12px;transition:.15s;white-space:nowrap}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
.btn.green{background:linear-gradient(135deg,#3ddc84,#1c8f50);border-color:#7bf0b0}
.btn.red{background:linear-gradient(135deg,#ff4d5e,#a8202e);border-color:#ff9aa4;color:#fff}
.btn.ghost{background:var(--glass);color:var(--txt);border-color:var(--line)}
.btn[disabled]{opacity:.35;pointer-events:none}
.list{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:9px;padding-right:4px}
.row{display:grid;grid-template-columns:46px 1fr 200px auto;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass);transition:.15s}
.row:hover{background:var(--glass2);border-color:var(--gold)}
.row .n{color:var(--gold);font-size:13px}
.row .t{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{display:block;font-size:10px;opacity:.55;margin-top:3px}
.row .c{font-size:11px;color:#cdbf92;font-family:ui-monospace,Consolas,monospace}
.row .a{display:flex;gap:7px}
.row .a .btn{padding:8px 11px}
.empty{padding:40px;text-align:center;opacity:.6;font-size:13px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:820px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:11px;color:var(--gold2)}
.msg{position:fixed;left:50%;bottom:36px;transform:translateX(-50%);padding:12px 22px;border-radius:14px;background:rgba(10,11,16,.96);border:1px solid var(--gold);color:var(--gold2);font-size:12px;opacity:0;pointer-events:none;transition:.25s}
.msg.on{opacity:1;transform:translate(-50%,-6px)}
</style>
</head>
<body>
<div id="app">
 <div class="win">
  <aside>
   <div class="sech">ORGANS</div>
   <button class="navbtn on" id="navHome">Home</button>
   <div id="orgList" class="scroll"></div>
  </aside>
  <main>
   <header>
    <div class="logo">UNIQUE JOB<small id="who">GOVERNMENT CONTROL</small></div>
    <div class="sp"></div>
    <button class="x" id="x">&times;</button>
   </header>
   <div class="content" id="content"></div>
  </main>
 </div>
</div>
<div class="msg" id="msg"></div>

<script>
const RES = (typeof GetParentResourceName === 'function') ? GetParentResourceName() : 'Unique_JobManager';
const $ = (s, r = document) => r.querySelector(s);
const state = { orgs: [], depts: [], cur: null, tab: 'Blip', q: '', ops: 0 };
const TABS = ['Blip','Boss','Locker','Armory','Veh','V-Spawn','Heli','H-Spawn','Boat','B-Spawn','Other'];

function post(a, extra) {
  return fetch(`https://${RES}/action`, { method: 'POST', body: JSON.stringify(Object.assign({ a }, extra || {})) }).catch(() => {});
}
function toast(t) { const m = $('#msg'); m.textContent = t; m.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => m.classList.remove('on'), 2400); }
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const f1 = n => (Math.round(Number(n) * 100) / 100).toFixed(2);

function load(data) {
  state.orgs = data.orgs || []; state.depts = data.depts || []; state.ops = data.ops || 0;
  $('#who').textContent = (data.who || 'GOVERNMENT') + ' - CHIEF ACCESS';
  if (state.cur && !state.orgs.find(o => o.job === state.cur)) state.cur = null;
  renderNav(); render();
}

function renderNav() {
  const box = $('#orgList'); box.innerHTML = '';
  state.depts.forEach(d => {
    const orgs = state.orgs.filter(o => d.jobs.includes(o.job));
    if (!orgs.length) return;
    const h = document.createElement('div'); h.className = 'dept'; h.textContent = d.label; box.appendChild(h);
    orgs.forEach(o => {
      const b = document.createElement('button');
      b.className = 'navbtn' + (state.cur === o.job ? ' on' : '') + (o.off ? ' off' : '');
      b.innerHTML = `<span class="dot"></span>${esc(o.label)}<span class="cnt">${o.points.length}</span>`;
      b.onclick = () => { state.cur = o.job; state.tab = firstTab(o); state.q = ''; renderNav(); render(); };
      box.appendChild(b);
    });
  });
  $('#navHome').classList.toggle('on', !state.cur);
}
function firstTab(o) { return TABS.find(t => o.points.some(p => p.cat === t)) || 'Blip'; }

function render() {
  const c = $('#content');
  const o = state.orgs.find(x => x.job === state.cur);
  if (!o) {
    const pts = state.orgs.reduce((a, b) => a + b.points.length, 0);
    c.innerHTML = `
     <div class="cards">
      <div class="card"><b>${state.orgs.length}</b><span>ORGANS</span></div>
      <div class="card"><b>${pts}</b><span>POINTS (blip / marker / spawn ...)</span></div>
      <div class="card"><b>${state.orgs.filter(x => !x.off).length}</b><span>ORGANS ON</span></div>
      <div class="card"><b>${state.ops}</b><span>SAVED EDITS</span></div>
     </div>
     <div class="hint">
      <i>1.</i> Az list-e chap yek ergan entekhab konid.<br>
      <i>2.</i> Tab ha (Blip / Boss / Locker / Armory / Veh / V-Spawn / Heli ...) noqte ha-ye hamin ergan ra neshan midahand.<br>
      <i>3.</i> Be jaye jadid beravid va <i>SET HERE</i> ra bezanid: noqte be mokhtasat-e shoma montaghel mishavad (zakhire dar database, baraye hame zende).<br>
      <i>4.</i> <i>+ ADD HERE</i> yek noqte-ye jadid hamin noe (copy-e akharin) dar mokhtasat-e shoma misazad. <i>DEL</i> hazf mikonad.<br>
      <i>5.</i> Tab <i>Style</i>: no-e marker, size, rang va fasele-ye namayesh.<br>
      <i>*</i> Blip ha ba taghir-e job ya vorud-e mojaddad bazsazi mishavand.
     </div>`;
    return;
  }
  const counts = {}; o.points.forEach(p => counts[p.cat] = (counts[p.cat] || 0) + 1);
  c.innerHTML = `
   <div class="tabs">${TABS.map(t => `<div class="tab ${state.tab === t ? 'on' : ''}" data-t="${t}">${t}<em>${counts[t] || 0}</em></div>`).join('')}
    <div class="tab ${state.tab === 'Style' ? 'on' : ''}" data-t="Style">Style</div></div>
   <div id="pane" style="display:flex;flex-direction:column;gap:12px;flex:1;min-height:0"></div>`;
  c.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.tab = t.dataset.t; render(); });
  state.tab === 'Style' ? renderStyle(o) : renderPoints(o);
}

function renderPoints(o) {
  const pane = $('#pane');
  const all = o.points.filter(p => p.cat === state.tab);
  const q = state.q.trim().toLowerCase();
  const pts = q ? all.filter(p => (p.label + p.id).toLowerCase().includes(q)) : all;
  const addSrc = all.find(p => p.sec);
  pane.innerHTML = `
   <div class="bar">
    <input class="inp" id="q" placeholder="Search ..." value="${esc(state.q)}">
    <button class="btn green" id="add" ${addSrc ? '' : 'disabled'}>+ ADD HERE</button>
   </div>
   <div class="list scroll">${pts.length ? pts.map((p, i) => `
     <div class="row">
      <div class="n">#${i + 1}</div>
      <div class="t">${esc(p.label)}<small>${esc(p.id)}</small></div>
      <div class="c">${f1(p.x)}, ${f1(p.y)}, ${f1(p.z)}${p.h != null ? ' | h ' + f1(p.h) : ''}</div>
      <div class="a">
       <button class="btn ghost" data-go="${esc(p.id)}">GO</button>
       <button class="btn" data-set="${esc(p.id)}">SET HERE</button>
       <button class="btn red" data-del="${esc(p.del || '')}" ${p.del ? '' : 'disabled'}>DEL</button>
      </div>
     </div>`).join('') : '<div class="empty">Hich noqte-i dar in tab nist.</div>'}</div>`;
  $('#q').oninput = e => { state.q = e.target.value; renderPoints(o); const q2 = $('#q'); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); };
  const add = $('#add'); if (add) add.onclick = () => post('add', { job: o.job, sec: addSrc.sec });
  pane.querySelectorAll('[data-go]').forEach(b => b.onclick = () => post('goto', { job: o.job, id: b.dataset.go }));
  pane.querySelectorAll('[data-set]').forEach(b => b.onclick = () => post('set', { job: o.job, id: b.dataset.set }));
  pane.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    if (!b.dataset.del) return;
    if (!b.dataset.arm) { b.dataset.arm = '1'; b.textContent = 'SURE?'; setTimeout(() => { b.dataset.arm = ''; b.textContent = 'DEL'; }, 2500); return; }
    post('del', { job: o.job, id: b.dataset.del });
  });
}

function renderStyle(o) {
  const s = o.style || {};
  const pane = $('#pane');
  const fld = (k, lab, v, step) => `<label>${lab}<input class="inp" data-k="${k}" type="number" step="${step || 1}" value="${v == null ? '' : v}"></label>`;
  pane.innerHTML = `
   <div class="hint">Marker-e hame-ye noqte haye <i>${esc(o.label)}</i> ra tanzim konid. Khali = bedun-e taghir.</div>
   <div class="form">
    ${fld('MarkerType', 'MARKER TYPE (GTA id)', s.MarkerType)}
    ${fld('MarkerTypeboss', 'BOSS MARKER TYPE', s.MarkerTypeboss)}
    ${fld('MarkerTypeveh', 'VEHICLE MARKER TYPE', s.MarkerTypeveh)}
    ${fld('MarkerTypevehdel', 'DELETE MARKER TYPE', s.MarkerTypevehdel)}
    ${fld('DrawDistance', 'DRAW DISTANCE', s.DrawDistance, 0.5)}
    <span></span>
    ${fld('sx', 'SIZE X', s.sx, 0.1)}${fld('sy', 'SIZE Y', s.sy, 0.1)}${fld('sz', 'SIZE Z', s.sz, 0.1)}
    ${fld('r', 'COLOR R', s.r)}${fld('g', 'COLOR G', s.g)}${fld('b', 'COLOR B', s.b)}
   </div>
   <div><button class="btn green" id="saveStyle">SAVE STYLE</button></div>`;
  $('#saveStyle').onclick = () => {
    const v = {}; pane.querySelectorAll('[data-k]').forEach(i => { if (i.value !== '') v[i.dataset.k] = Number(i.value); });
    post('style', { job: o.job, values: v });
  };
}

$('#navHome').onclick = () => { state.cur = null; renderNav(); render(); };
$('#x').onclick = () => fetch(`https://${RES}/close`, { method: 'POST', body: '{}' });
window.addEventListener('keydown', e => { if (e.key === 'Escape') $('#x').click(); });
window.addEventListener('message', e => {
  const m = e.data || {};
  if (m.type === 'open') { $('#app').classList.add('on'); load(m.data || {}); }
  else if (m.type === 'update') { load(m.data || {}); if (m.data && m.data.toast) toast(m.data.toast); }
  else if (m.type === 'close') { $('#app').classList.remove('on'); }
  else if (m.type === 'toast') toast(m.text);
});
</script>
</body>
</html>
