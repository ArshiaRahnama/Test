<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Unique Rent</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>

<!--
  The vehicle picker, duration tiers and confirm step now all live in
  ox_lib's own menu UI (lib.registerContext / lib.alertDialog), driven from
  functions/main.lua. This page only renders the rental countdown ring,
  shown/hidden via the "show_timer" / "hide_timer" postMessages -- see
  html/js/functions.js.
-->
<body>
    <div class="ui" style="display: none;">
      <div class="container-timer" style="display: none;">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center">
            <i id="icon" class="bi-stopwatch"></i>
            <div class="time" id="timer">--</div>
          </div>
        </div>
        <div class="info">
          <h1 class="info-title" id="timer-vehicle">Rental Active</h1>
          <div class="info-sub" id="timer-sub">Return the vehicle to the red marker</div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="js/index.js"></script>
    <script src="js/functions.js"></script>
</body>
</html>
