<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Unique Rent</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
</head>

<body>
    <div class="ui" style="display: none;">
      <div class="content">
        <button class="panel-close" id="btn-close" title="Close (ESC)"><i class="bi-x-lg"></i></button>

        <div class="panel-header">
          <div class="panel-eyebrow">Unique Rent — Premium Fleet Access</div>
          <h1 class="panel-title">Rent a Vehicle</h1>
          <div class="panel-rule"></div>
        </div>

        <div class="duration-bar" id="duration-bar" style="display: none;"></div>

        <div class="filters" id="filters" style="display: none;"></div>

        <div class="vehicles" style="display: none;"></div>

        <div class="panel-empty" id="panel-empty" style="display: none;">
          <i class="bi-emoji-frown"></i>
          <p>No vehicles are available at this location right now.</p>
        </div>

        <div class="panel-credit">Arshia &nbsp;·&nbsp; arshiahub.ir</div>
      </div>

      <div class="modal-backdrop" id="modal-backdrop" style="display: none;">
        <div class="confirm-modal">
          <div class="confirm-image">
            <img id="confirm-img" alt="">
          </div>
          <div class="confirm-title" id="confirm-title">Vehicle</div>

          <div class="confirm-row">
            <span class="confirm-label">Duration</span>
            <span class="confirm-value" id="confirm-duration">—</span>
          </div>
          <div class="confirm-row">
            <span class="confirm-label">Total price</span>
            <span class="confirm-value confirm-price" id="confirm-price">—</span>
          </div>

          <div class="confirm-note">The amount is deducted immediately on confirmation.</div>

          <div class="confirm-actions">
            <button class="btn-secondary" id="confirm-cancel">Cancel</button>
            <button class="btn-primary" id="confirm-pay"><i class="bi-key-fill"></i> Confirm &amp; Pay</button>
          </div>
        </div>
      </div>

      <div class="container-timer" style="display: none;">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center">
            <i id="icon" class="bi-stopwatch"></i>
            <div class="time" id="timer">--</div>
          </div>
        </div>
        <div class="info">
          <h1 class="info-title" id="timer-vehicle">Rental Active</h1>
          <div class="info-sub" id="timer-sub">Return the vehicle to the red marker</div>
        </div>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="js/index.js"></script>
    <script src="js/functions.js"></script>
</body>
</html>
