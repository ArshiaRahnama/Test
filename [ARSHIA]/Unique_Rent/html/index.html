<!DOCTYPE html>
<html>

<head>
    <title>Unique Rent</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="css/index.css">
    <link rel="stylesheet" type="text/css" href="css/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css"/>
</head>

<body>
    <script src="js/config.js"></script>
    <script src="https://code.jquery.com/jquery-3.3.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
    <script src="js/index.js"></script>
    <script src="js/functions.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>

    <div class="ui" style="display: none;">
      <div class="content">
        <div class="panel-header">
          <div class="panel-eyebrow">Unique Rent — Premium Fleet Access</div>
          <h1 class="panel-title">Rent a Vehicle</h1>
          <div class="panel-rule"></div>
        </div>
        <div class="vehicles" style="display: none;"></div>
        <div class="panel-credit">Arshia &nbsp;·&nbsp; arshiahub.ir</div>
      </div>

      <div class="container-timer" style="display: none;">
        <div class="ring-wrap">
          <svg class="ring-svg" viewBox="0 0 120 120">
            <circle class="ring-track" cx="60" cy="60" r="52"></circle>
            <circle id="ring-progress" class="ring-progress" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="ring-center">
            <i id="icon" class="bi-stopwatch"></i>
            <div class="time" id="timer">--</div>
          </div>
        </div>
        <div class="info">
          <h1 class="info-title">Rental Active</h1>
        </div>
      </div>
    </div>
</body>
</html>
