<html>
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700,900&display=swap"
      id="font"
    />
    <script
      src="https://kit.fontawesome.com/cb27a9ac19.js"
      crossorigin="anonymous"
    ></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css"
    />

    <link rel="stylesheet" type="text/css" href="main.css" />

    <title>UI</title>
  </head>
  <body>
    <div class="bg2"></div>
    <div class="bg">
      <!-- <div class="img"></div>
      <div class="img2"></div> -->
      <img class="server-logo" src="img/unique_icon.png" alt="Unique RP" />
      <div class="big-name">UNIQUE <span>VEHICLE</span></div>
      <div class="name-shop">SHOP</div>
      <div class="line"></div>
      <div class="dec">
        Lorem ipsum dolor sit amet consectetur. Consectetur condimentum erat sed
        fringilla lacinia bibendum.
      </div>
      <input
        type="text"
        onkeyup="myFunctionnn()"
        placeholder="&#xf002; &#xf142; Search Vehicle"
        style="font-family: 'Poppins', sans-serif, FontAwesome"
        id="searchj"
        class="SearchInput"
      />
      <div class="car-list-bg">
        <div id="vehicle"></div>
        <div class="no-result" id="no-result">No vehicle found</div>
      </div>
      <center>
        <div class="cattegory"></div>
      </center>
      <div class="exit" onclick="exit()">
        EXIT
        <div class="exit-img"></div>
      </div>
      <div class="car-cat-show"></div>
      <div class="car-cat-name">BLISTA</div>
      <div class="price-text">PRICE</div>
      <div class="price-main"><span>$75000</span></div>
      <div class="engine-menu">
        <div class="engine-icon"></div>
        <div class="engine-text">SPEED</div>
        <div class="bar">
          <div class="bar-r">
            <ul id="loader" class="engine"></ul>
          </div>
        </div>
        <div class="brake-icon"></div>
        <div class="brake-text">BRAKE</div>
        <div class="bar">
          <div class="bar-r">
            <ul id="loader" class="brake"></ul>
          </div>
        </div>
        <div class="torque-icon"></div>
        <div class="torque-text">TORQUE</div>
        <div class="bar">
          <div class="bar-r">
            <ul id="loader" class="torque"></ul>
          </div>
        </div>
        <div class="power-icon"></div>
        <div class="power-text">POWER</div>
        <div class="bar">
          <div class="bar-r">
            <ul id="loader" class="power"></ul>
          </div>
        </div>
      </div>
      <div class="color-menu">
        <div class="car-color-text">VEHICLE COLOR</div>
        <div class="color-bar">
          <div class="color" id="white"></div>
          <div class="color" id="black"></div>
          <div class="color" id="grey"></div>
          <div class="color" id="yellow"></div>
          <div class="color" id="green"></div>
          <div class="color" id="blue"></div>
          <div class="color" id="red"></div>
          <div class="color" id="purple"></div>
          <div class="color" id="petrol"></div>
          <div class="color" id="cyan"></div>
          <div class="color" id="orange"></div>
          <div class="color" id="dark-blue"></div>
        </div>
      </div>
      <div class="buy-button" onclick="buy()">BUY</div>
      <div class="test-button" onclick="test()">TEST DRIVE</div>
    </div>
    <script src="nui://game/ui/jquery.js" type="text/javascript"></script>
    <script src="js/fontawesome.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/tomik23/circular-progress-bar@1.1.9/dist/circularProgressBar.min.js"></script>
    <script src="js/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/cferdinandi/saferInnerHTML@1/dist/saferInnerHTML.polyfills.min.js"></script>
    <script src="js.js"></script>
  </body>
</html>
