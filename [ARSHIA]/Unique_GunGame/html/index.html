<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Unique GunGame HUD</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="countdown" class="panel hidden">
        <div class="countdown-bar"></div>
        <div class="countdown-label">GunGame starts in</div>
        <div class="countdown-number">15</div>
    </div>

    <div id="timer" class="panel hidden">
        <span class="timer-tag">ROUND</span>
        <span class="timer-value">10:00</span>
    </div>

    <div id="killfeed"></div>

    <div id="scoreboard" class="panel hidden">
        <div class="scoreboard-head">
            <span class="scoreboard-title">UNIQUE GUNGAME</span>
        </div>
        <div class="scoreboard-columns">
            <span class="col-rank">#</span>
            <span class="col-name">Player</span>
            <span class="col-lvl">LVL</span>
            <span class="col-kills">Kills</span>
        </div>
        <div id="scoreboard-rows"></div>
    </div>

    <div id="mvp-screen" class="hidden">
        <div class="mvp-card">
            <div class="mvp-label">MVP</div>
            <div id="mvp-callingcard" class="mvp-callingcard">
                <div class="mvp-callingcard-fallback">★</div>
            </div>
            <div id="mvp-name" class="mvp-name">Player</div>
            <div id="mvp-kills" class="mvp-kills">0 KILLS</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
