<!-- `boot`: até o system.js dizer se estamos no jogo, o fundo fica TRANSPARENTE e o aparelho
     invisível. Sem isto o NUI pintava 1920×1080 de #0B0B0F por cima do jogo durante todo o
     arranque (o body só fica transparente com a classe `fivem`, posta em JS) e o telemóvel
     aparecia um instante no canto antes de a animação de subir começar. -->
<body class="boot">

<div class="stage">
  <div class="device frame-orange">
    <div class="bezel">
      <div class="screen locked" id="screen">
        <div class="wallpaper custom"></div>
        <div class="wallpaper wallpaper-lock custom"></div>
        <div class="torch-glow"></div>
        <div class="island"><div class="cam"></div></div>

        <div class="statusbar">
          <span class="sb-time" id="sbTime">9:41</span>
          <span class="sb-right"></span>
        </div>

        <div class="layer" id="lock"></div>
        <div class="layer" id="home"></div>
        <div id="apps"></div>
        <div id="setup"></div>
        <div class="home-bar" id="homeBar"></div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn" id="btnLock">Bloquear</button>
  <button class="btn" id="btnTheme">Claro / Escuro</button>
  <span>PIN <code>1225</code></span>
  <span>F7 switcher · F8 notificações · F9 Control Center · Esc fechar</span>
  <span>PearPhone 18 Pro · 440 × 956 pt · PearOS 27</span>
</div>

<!-- localdb.js (38 KB) é o servidor de mentira do browser. DENTRO DO JOGO nunca é usado:
     o bridge.js só lhe chama quando `!inFiveM`, e todos os `LocalDB.register(...)` das apps
     estão guardados por `if (window.LocalDB && ...)`. Por isso só se carrega fora do jogo:
     são 38 KB a menos para descarregar e analisar no arranque de CADA jogador.
     document.write é de propósito: mantém a ORDEM de carregamento (tem de vir antes das apps). -->
<script>if (typeof GetParentResourceName !== 'function') document.write('<scr' + 'ipt src="js/localdb.js?v=120"><\/scr' + 'ipt>');</script>
