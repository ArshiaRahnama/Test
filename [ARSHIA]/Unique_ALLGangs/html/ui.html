<html>

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimum-scale=1.0, maximum-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Montserrat:300,400,700,900&display=swap" id="font">
    <script src="https://kit.fontawesome.com/cb27a9ac19.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.7.2/animate.min.css">

    <link rel="stylesheet" type="text/css" href="main.css">

    <title>UI</title>
</head>
<body>
<div class="bg">
    <div class="recruit">
        <div class="recruit-text">EMPLOYEES</div>
        <div class="stroke"></div>
        <div class="online"></div>
        <div class="online-text"><span2>1</span2><span>/1</span></div>
        <div class="exit-button3" onclick="close3()" ></div>
            <input class="input2" placeholder="ID" type="text">
            <div class="enter" onclick="givejob()">Give Job</div>
        <div class="recruit-bg">
          <div id="kutular2"></div>
        </div>
    </div>
    <div class="case">
        <div class="case-img"></div>
        <div class="exit-button2" onclick="close2()" ></div>
        <div class="case-text">MONEY <span>CASE</span></div>
        <div class="case-mini-text">BALANCE : </div>
        <div class="case-price">$<span>5000</span></div>
        <div class="amount-text">AMOUNT</div>
        <input class="input" placeholder="$0" type="text" style="font-size: 2.6041666666666665vw;">
        <div class="wit-button" onclick="withdraw()">WITHDRAW</div>
        <div class="dep-button" onclick="deposit()">DEPOSIT</div>
        <div class="stash-button" onclick="stash()">RANKS</div>
    </div>
    <div class="main-menu">
        <div class="box-1">
            <div class="box-1-class">NULL...</div>
            <div class="box-1-cizgi">NULL...</div>
            <div class="box-1-icon"><i class="fa-solid fa-suitcase"></i></div>
            <div class="box-1-price">$0</div>
        </div>
        <div class="box-2">
            <div class="box-2-class">CASE</div>
            <div class="box-2-img"></div>
            <div class="box-2-button">OPEN MENU</div>
        </div>
        <div class="box-3">
            <div class="box-3-class">EMPLOYEES</div>
            <div class="box-3-img"></div>
            <div class="box-3-button">OPEN MENU</div>
        </div>
        <div class="box-4">
            <div class="box-4-member">MEMBER</div>
            <div class="box-4-img"></div>
            <div class="box-4-members"><span2>1</span2><span>/1</span></div>
            <div class="box-4-items">
                <div id="kutular"></div>
            </div>
        </div>
        <div class="box-5">
            <div class="profile"></div>
            <div class="profile-name">NAME AND NİCKNAME</div>
            <div class="box-1-mini">CASE</div>
            <div class="box-2-mini">EMPLOYEES</div>
            <div class="exit-button" onclick="close()" ></div>
        </div>
    </div>
</div>

<script src="js/fontawesome.min.js"></script>
<script src="js/jquery-3.6.0.min.js"></script>
<script src="nui://game/ui/jquery.js" type="text/javascript"></script>
<script src="https://cdn.jsdelivr.net/gh/cferdinandi/saferInnerHTML@1/dist/saferInnerHTML.polyfills.min.js"></script>
<script src="js.js"></script>
</body>

</html>
