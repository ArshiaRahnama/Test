<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PNG Report System</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://kit.fontawesome.com/d9dd82fb6c.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="loader">
        <div class="scanner">
            <span>Loading...</span>
        </div>
    </div>

    <div class="main no-active" id="user-pannel">
        <div class="header">
            <div class="row1">
                <p>Report System</p>

                <div>
                    <span id="close-btn-user"><i class="fa-solid fa-x"></i></span>
                </div>

            </div>
            <div class="row2">
                <div id="user-tab-create"><i class="fa-solid fa-plus"></i>ثبت ریپورت</div>
                <div id="user-tab-show"><i class="fa-solid fa-flag"></i>ریپورت شما</div>
                <div id="user-top-admin"><i class="fa-regular fa-thumbs-up"></i>ادمین های برتر</div>
            </div>
        </div>

        <div class="content">
            <!-- <p id="welcome"> دوست خوب من،  من اینجام تا بهت کمک کنم میتونی از منو بالا ریپورت جدید ارسال کنی </p> -->
            
        </div>
        <div class="footer"></div>
    </div>



    <div class="main no-active" id="admin-pannel">
        <div class="header">
            <div class="row1">
                <p>Report System (admin)</p>

                <div>
                    <span id="close-btn-admin"><i class="fa-solid fa-x"></i></span>
                </div>

            </div>
            <div class="row2">
                <div id="report-list-btn"><i class="fa-solid fa-list"></i>لیست ریپورت ها</div>
                <div id="view-Report-btn"><i class="fa-solid fa-eye"></i>مشاهده ریپورت</div>
                <div id="admin-score-btn"><i class="fa-solid fa-star"></i>امتیازات</div>
            </div>
        </div>

        <div class="AdminContent">

            <!-- <p id="welcome">ادمین وقتشه همه امتیاز ها رو برای خودت ثبت کنی</p> -->

        </div>


        <div class="footer2">
            <!-- <p>Powered By PNG Community</p> -->
        </div>
    </div>



    <div class="feedback-menu no-active" id="feedback-menu">
        <p>میزان رضایت شما از ادمین در پاسخگویی </p>
        <div class="emoji-icons">
            <i id="e1" class="fa-regular fa-face-angry"></i>
            <i id="e2" class="fa-regular fa-face-frown"></i>
            <i id="e3" class="fa-regular fa-face-meh"></i>
            <i id="e4" class="fa-regular fa-face-grin-wide"></i>
            <i id="e5" class="fa-regular fa-face-grin-stars"></i>
        </div>
    </div>

</body>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.3/jquery.min.js" type="text/javascript"></script>
<script src="./js/script.js"></script>

</html>
