<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unique_AdminPanel</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }
  iframe {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    border: none;
    background: transparent;
    /* Neither panel is open on a fresh resource start, so neither should
       be able to swallow clicks meant for the game / the other panel.
       The script below grants pointer-events to whichever one just
       received a message meant for it. */
    pointer-events: none;
  }
</style>
</head>
<body>
<!--
  This resource merges three previously-separate NUI apps (the AdminMenu
  panel, the UNIQUE_AC anti-cheat panel, and the Report System panel), and
  FiveM only allows ONE `ui_page` per resource. Rather than merging large,
  independently built single-page apps (html/adminmenu.html + app.js/
  style.css, ui/index.html + ui/js/script.js/ui/css/style.css, and
  ui/report/index.html + ui/report/js/script.js/ui/report/css/*.css) into
  one DOM - risking duplicate element IDs and CSS collisions - each one
  keeps living in its own iframe, completely isolated from the others.
  Neither app's internal code (app.js / script.js / their CSS) was changed
  for this.

  NOTE ON PATHS: this file lives at html/index.html, so the browser
  resolves the src="" paths below relative to the html/ folder, not the
  resource root - adminmenu.html is a sibling (no "html/" prefix), the
  other two need "../" to reach ui/ from inside html/.

  Two things the script below does:
  1. Forwards every SendNUIMessage from Lua into ALL THREE iframes. Safe
     because AdminMenu's app.js switches on `event.data.type`, while both
     UNIQUE_AC's script.js AND the Report System's script.js check
     `event.data.action` - a message meant for one is simply ignored by
     the other (neither has a `default`/`else` branch that does
     anything). Since UNIQUE_AC and the Report System BOTH key off
     `action`, Lua-side every Report System SendNUIMessage additionally
     sets `_uniqueReport = true` so this shell can tell the two apart for
     focus routing - script.js in either iframe just ignores that extra
     field, it doesn't affect their own `data.action` checks. NUI
     callbacks (the `fetch()` calls each app makes back to Lua) are
     unaffected by the iframe nesting - they're plain fetch() calls to
     this resource's own NUI host, independent of which frame issues them.
  2. Grants `pointer-events: auto` (mouse) AND keyboard focus to whichever
     iframe a message was shaped for, and takes pointer-events away from
     the other two - otherwise an iframe sitting on top in stacking order
     would silently swallow every click meant for the panel underneath,
     even while its own content is fully hidden. The focus() call matters
     because each app's own Escape-key handler is bound to its own
     document - without moving keyboard focus along with pointer-events,
     Escape could reach a panel that isn't the one actually open.
-->
<iframe id="admin-frame" src="adminmenu.html"></iframe>
<iframe id="ac-frame" src="../ui/index.html"></iframe>
<iframe id="report-frame" src="../ui/report/index.html"></iframe>
<!-- MenuV (F4 admin menu). Never takes pointer events: it is keyboard-driven and NUI focus stays off. -->
<iframe id="menuv-frame" src="menuv/menuv.html"></iframe>
<script>
  var RES = 'Unique_AdminPanel';

  window.addEventListener('message', function (event) {
    var data = event.data || {};

    // MenuV traffic (tagged _menuv by client/menuv/menuv.lua) goes ONLY to the
    // MenuV iframe - it must not activate/focus the other panels nor be
    // broadcast to them (menus resend whole item lists, that's wasted work).
    if (data._menuv) {
      var menuvFrame = document.getElementById('menuv-frame');
      if (menuvFrame && menuvFrame.contentWindow) menuvFrame.contentWindow.postMessage(data, '*');
      return;
    }
    var adminFrame = document.getElementById('admin-frame');
    var acFrame = document.getElementById('ac-frame');
    var reportFrame = document.getElementById('report-frame');

    function activate(frame, others) {
      if (frame) {
        frame.style.pointerEvents = 'auto';
        if (frame.contentWindow) {
          frame.contentWindow.focus();
          // فوکوس‌کردنِ خودِ window کافی نیست - اگه هیچی داخلِ سندِ
          // آیفریم واقعاً فوکوس نگرفته باشه (نه حتی <body>)، کیدان‌لیسنرِ
          // خودِ اون سند ممکنه رویدادِ کیبورد رو نگیره. این یک تلاشِ
          // اضافیه، ضرری نداره (همون‌مبدأ‌ست، try/catch هم برای احتیاط).
          try {
            var doc = frame.contentWindow.document;
            if (doc && doc.body) doc.body.focus();
          } catch (e) {}
        }
      }
      others.forEach(function (f) { if (f) f.style.pointerEvents = 'none'; });
    }

    // BUG FIX ("the panel is open, the mouse is stuck on screen, nothing is clickable"):
    // client/nui_panel.lua sends a `stats` message every 8 seconds to any on-duty admin,
    // and the old code treated EVERY message as "open my panel" - so each stats tick
    // gave pointer-events to the admin-menu iframe and took them away from the Report /
    // AC panel the admin was actually using (its clicks then fell on a transparent iframe).
    // Only messages that OPEN or focus a panel may move pointer-events; background updates
    // (stats, alerts, list/chat refreshes, pings, data pushes) must leave them alone.
    var PASSIVE_TYPES = { stats: 1, newReportAlert: 1, searchResults: 1 };
    var PASSIVE_ACTIONS = { refreshList: 1, refreshChat: 1, ping: 1, activeClosed: 1,
                            updateAdminLog: 1, updateAppeals: 1, updateBranding: 1,
                            updatePlayerProfile: 1, forceClose: 1 };

    if (data._uniqueReport) {
      if (data.action === 'hideAll') {
        if (reportFrame) reportFrame.style.pointerEvents = 'none';
      } else if (!PASSIVE_ACTIONS[data.action]) {
        activate(reportFrame, [adminFrame, acFrame]);
      }
    } else if (typeof data.type !== 'undefined') {
      if (!PASSIVE_TYPES[data.type]) activate(adminFrame, [acFrame, reportFrame]);
    } else if (typeof data.action !== 'undefined') {
      if (data.action === 'forceClose') {
        if (acFrame) acFrame.style.pointerEvents = 'none';
      } else if (!PASSIVE_ACTIONS[data.action]) {
        activate(acFrame, [adminFrame, reportFrame]);
      }
    }

    if (adminFrame && adminFrame.contentWindow) {
      adminFrame.contentWindow.postMessage(event.data, '*');
    }
    if (acFrame && acFrame.contentWindow) {
      acFrame.contentWindow.postMessage(event.data, '*');
    }
    if (reportFrame && reportFrame.contentWindow) {
      reportFrame.contentWindow.postMessage(event.data, '*');
    }
  });

  // ------------------------------------------------------------- Esc ---
  // یک لایه‌ی اضافیِ best-effort، نه خطِ دفاعِ اصلی. با تستِ واقعی (نه
  // حدس) معلوم شد که وقتی contentWindow.focus() آیفریمِ گزارش رو فعال
  // میکنه، فوکوسِ کیبوردِ واقعی میره رو خودِ المنتِ <iframe> تو سندِ
  // بالایی - نه رو چیزی داخلِ سندِ خودِ آیفریم. نتیجه: هم این لیسنرِ
  // سطحِ بالا (چون activeElement دیگه «سند» نیست) هم حتی کیدان‌لیسنرِ
  // خودِ آیفریم (چون هیچی داخلش واقعاً فوکوس نگرفته) هر دو ممکنه رویدادِ
  // کیبورد رو از دست بدن - این محدودیتِ امنیتیِ خودِ مرورگره (رویدادِ
  // کیبورد از مرزِ فریم رد نمیشه)، نه یک باگِ قابلِ‌رفعِ کاملِ سمتِ ما.
  //
  // خطِ دفاعِ واقعی و قابلِ‌اتکا سمتِ Lua ئه (client/report_main.lua) -
  // مستقیم از روی کنترلِ نیتیوِ بازی می‌خونه، کاملاً مستقل از فوکوسِ DOM.
  // این لیسنر فقط برای حالت‌هایی که مرورگر لطف کنه نگهش داشتیم - ضرری
  // نداره، گاهی زودتر از ترد Lua واکنش نشون میده.
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;

    var reportFrame = document.getElementById('report-frame');
    if (!reportFrame || reportFrame.style.pointerEvents !== 'auto') return; // پنلِ گزارش الان فعال نیست

    if (reportFrame.contentWindow) {
      reportFrame.contentWindow.postMessage({ _uniqueReport: true, ureport: 'hideAll' }, '*');
    }
    reportFrame.style.pointerEvents = 'none';

    fetch('https://' + RES + '/exit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=UTF-8' },
      body: JSON.stringify({}),
    }).catch(function () {});
  });
</script>
</body>
</html>
