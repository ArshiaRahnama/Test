<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unique_AdminMenu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Radial quick-actions menu (F7) -->
  <div id="radial" class="hidden">
    <div id="radialRing"></div>
    <div id="radialLabel">Quick Actions</div>
  </div>

  <!-- Big panel: Inspect / Reports / Chat Log -->
  <div id="panel" class="hidden">
    <div id="panelHeader">
      <span id="panelTitle">Panel</span>
      <span id="panelClose">✕</span>
    </div>
    <div id="panelSearchWrap" class="hidden">
      <input id="panelSearch" type="text" placeholder="Search..." />
    </div>
    <div id="panelBody"></div>
  </div>

<script src="app.js"></script>
</body>
</html>
