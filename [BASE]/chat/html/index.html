<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title></title>
  <link href="vendor/latofonts.css" rel="stylesheet">
  <link href="vendor/flexboxgrid.6.3.1.min.css" rel="stylesheet"></link>
  <link href="vendor/animate.3.5.2.min.css" rel="stylesheet"></link>
  <link href="index.css" rel="stylesheet"></link>

  <script src="vendor/vue.2.3.3.min.js" type="text/javascript"></script>
  <script src="config.default.js" type="text/javascript"></script>
  <script src="config.js" type="text/javascript"></script>
</head>
<body>
  <div id="app"></div>

  <!-- App Template -->
  <script type="text/x-template" id="app_template">
    <div id="app" :style="[computedAppStyle, themeStyle]" :class="'font-' + settings.fontSize">
      <!-- Settings Panel (outside chat-container to avoid background overlap) -->
      <div class="settings-panel" v-show="showSettings" :style="computedSettingsStyle" @click.stop>
          <div class="settings-header" @mousedown="startDragSettings" style="cursor: move;">
            <span class="settings-title">Chat Settings</span>
            <span class="settings-close" @click="showSettings = false">×</span>
          </div>

          <div class="settings-tabs">
            <div class="settings-tab" :class="{ active: settingsTab === 'chat' }" @click="settingsTab = 'chat'">Chat</div>
            <div class="settings-tab" :class="{ active: settingsTab === 'menus' }" @click="settingsTab = 'menus'">Menus</div>
          </div>

          <div class="settings-body">
            <div v-show="settingsTab === 'chat'">
            <!-- Behavior Section -->
            <div class="settings-section">
              <div class="section-title">Behavior</div>
              <div class="setting-row">
                <span class="setting-label">Show on new message</span>
                <label class="toggle-switch">
                  <input type="checkbox" v-model="tempSettings.showOnNewMessage">
                  <span class="toggle-slider"></span>
                </label>
              </div>
              <div class="setting-row">
                <span class="setting-label">Lock position</span>
                <label class="toggle-switch">
                  <input type="checkbox" v-model="tempSettings.lockPosition">
                  <span class="toggle-slider"></span>
                </label>
              </div>
            </div>

            <!-- Appearance Section -->
            <div class="settings-section">
              <div class="section-title">Appearance</div>

              <div class="setting-row">
                <span class="setting-label">Font Size</span>
                <div class="button-group">
                  <button :class="{ active: tempSettings.fontSize === 'small' }" @click="tempSettings.fontSize = 'small'">S</button>
                  <button :class="{ active: tempSettings.fontSize === 'medium' }" @click="tempSettings.fontSize = 'medium'">M</button>
                  <button :class="{ active: tempSettings.fontSize === 'large' }" @click="tempSettings.fontSize = 'large'">L</button>
                </div>
              </div>

              <div class="setting-row">
                <span class="setting-label">Width</span>
                <span class="setting-value">{{ tempSettings.chatWidth }}%</span>
              </div>
              <input type="range" class="slider" min="20" max="60" v-model="tempSettings.chatWidth">

              <div class="setting-row">
                <span class="setting-label">Height</span>
                <span class="setting-value">{{ tempSettings.chatHeight }}px</span>
              </div>
              <input type="range" class="slider" min="150" max="400" v-model="tempSettings.chatHeight">
            </div>

            <!-- Theme Section -->
            <div class="settings-section">
              <div class="section-title">Theme</div>
              <div class="setting-row">
                <span class="setting-label">Accent Color</span>
                <div class="color-picker-wrapper">
                  <input type="color" class="color-picker" v-model="tempSettings.themeColor">
                  <span class="color-value">{{ tempSettings.themeColor }}</span>
                </div>
              </div>
            </div>

            <!-- Filter Section - Grouped by category for scalability -->
            <div class="settings-section show-in-live-section">
              <div class="section-title">Show in Live Tab</div>
              <div class="filter-groups-container">
                <div class="filter-group" v-for="group in showInLiveGrouped" :key="group.name">
                  <div class="filter-group-header">
                    <span class="filter-group-name">{{ group.name }}</span>
                    <span class="filter-group-count">{{ group.items.length }}</span>
                  </div>
                  <div class="filter-group-items">
                    <label class="filter-chip"
                           v-for="option in group.items"
                           :key="option.key"
                           :class="{ active: tempSettings.showInLive[option.key] }">
                      <input type="checkbox" v-model="tempSettings.showInLive[option.key]">
                      <span>{{ option.label }}</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
            </div>
            <div v-show="settingsTab === 'menus'">
            <!-- Menus Section -->
            <div class="settings-section">
              <div class="menu-block" v-for="m in menuDefs" :key="m.key">
                <div class="menu-block-title">{{ m.label }}</div>
                <div class="setting-row" v-if="m.dual">
                  <span class="setting-label">Rang asli az chat</span>
                  <label class="toggle-switch">
                    <input type="checkbox" v-model="tempSettings.menus[m.key].usePrimaryChat">
                    <span class="toggle-slider"></span>
                  </label>
                </div>
                <div class="setting-row" v-if="m.dual" v-show="!tempSettings.menus[m.key].usePrimaryChat">
                  <span class="setting-label">Rang asli</span>
                  <div class="color-picker-wrapper">
                    <input type="color" class="color-picker" v-model="tempSettings.menus[m.key].colorPrimary">
                    <span class="color-value">{{ tempSettings.menus[m.key].colorPrimary }}</span>
                  </div>
                </div>
                <div class="setting-row">
                  <span class="setting-label">{{ m.dual ? 'Rang dovom az chat' : 'Rang az chat' }}</span>
                  <label class="toggle-switch">
                    <input type="checkbox" v-model="tempSettings.menus[m.key].useChatColor">
                    <span class="toggle-slider"></span>
                  </label>
                </div>
                <div class="setting-row" v-show="!tempSettings.menus[m.key].useChatColor">
                  <span class="setting-label">{{ m.dual ? 'Rang dovom' : 'Rang menu' }}</span>
                  <div class="color-picker-wrapper">
                    <input type="color" class="color-picker" v-model="tempSettings.menus[m.key].color">
                    <span class="color-value">{{ tempSettings.menus[m.key].color }}</span>
                  </div>
                </div>
                <div class="menu-relocate-hint" v-show="m.pos">Ghost {{ m.label }} ro ba mouse bekesh ta jabeja beshe</div>
              </div>
            </div>
            </div>
          </div>

          <div class="settings-footer">
            <div class="unsaved-indicator" v-show="hasUnsavedChanges">
              <span class="unsaved-dot"></span>
              <span>Changes not saved</span>
            </div>
            <div class="footer-buttons">
              <button class="btn-reset" @click="resetSettings">Reset</button>
              <button class="btn-cancel" @click="showSettings = false">Cancel</button>
              <button class="btn-apply" :class="{ 'has-changes': hasUnsavedChanges }" @click="applySettings">Apply</button>
            </div>
          </div>
          <div class="settings-hint">
            Tip: Use <span class="hint-command">/chatsetting</span> to open this menu
          </div>
        </div>

      <!-- F5/F6 Menu Ghost Preview (relocate) -->
      <div class="menu-ghost-layer" v-show="showSettings && settingsTab === 'menus'">
        <div class="menu-ghost" :style="ghostStyle('f5')" @mousedown="startDragGhost($event, 'f5')">
          <div class="menu-ghost-accent" :style="{ backgroundColor: menuAccent('f5') }"></div>
          <div class="menu-ghost-row">
            <div class="menu-ghost-ic" :style="{ backgroundColor: menuAccent('f5') }"></div>
            <div class="menu-ghost-title" :style="{ color: menuAccent('f5') }">Menu Gang</div>
          </div>
          <div class="menu-ghost-tag" :style="{ color: menuAccent('f5'), borderColor: accentRgba('f5', 0.5) }">F5</div>
        </div>
        <div class="menu-ghost" :style="ghostStyle('f6')" @mousedown="startDragGhost($event, 'f6')">
          <div class="menu-ghost-accent" :style="{ backgroundColor: menuAccent('f6') }"></div>
          <div class="menu-ghost-row">
            <div class="menu-ghost-ic" :style="{ backgroundColor: menuAccent('f6') }"></div>
            <div class="menu-ghost-title" :style="{ color: menuAccent('f6') }">Menu Job</div>
          </div>
          <div class="menu-ghost-tag" :style="{ color: menuAccent('f6'), borderColor: accentRgba('f6', 0.5) }">F6</div>
        </div>
      </div>

      <!-- Main Chat Container -->
      <div class="chat-container" :class="{ fadeOut: !showWindow && !showInput }">
        <!-- Tab Bar - Generated from CHAT_TABS config -->
        <div class="chat-tabs" @mousedown="startDragChat" style="cursor: move;">
          <div class="chat-tab"
               v-for="tab in visibleTabs"
               :key="tab.key"
               :class="{ active: activeTab === tab.key, 'staff-tab': tab.key === 'staff', 'has-messages': tab.key === 'staff' && (tabs.staff.unread || tabs.staff.messages.length > 0) }"
               @click="switchTab(tab.key)">
            {{ tab.label }}
            <span class="badge" :class="{ show: tab.unread }"></span>
          </div>
        </div>

        <!-- Chat Messages -->
        <div class="chat-window" :style="computedChatStyle">
          <div class="chat-messages" ref="messages">
            <message v-for="msg in currentTabMessages"
                     :templates="templates"
                     :multiline="msg.multiline"
                     :args="msg.args"
                     :color="msg.color"
                     :template="msg.template"
                     :template-id="msg.templateId"
                     :key="msg">
            </message>
          </div>
        </div>

        <!-- Input Area -->
        <div class="chat-input" v-show="showInput">
          <span class="settings-icon" @click="toggleSettings">⚙</span>
          <span class="prefix">›</span>
          <textarea v-model="message"
                    ref="input"
                    type="text"
                    autofocus
                    spellcheck="false"
                    placeholder="Type a message..."
                    @keyup.tab="On_Tab"
                    @keyup.esc="hideInput"
                    @keyup="keyUp"
                    @keydown="keyDown"
                    @keypress.enter.prevent="send">
          </textarea>
        </div>

        <!-- Suggestions -->
        <suggestions :message="message" :suggestions="suggestions">
        </suggestions>
      </div>
    </div>
  </script>

  <!-- Message Template -->
  <script type="text/x-template" id="message_template">
    <div class="msg" :class="{ multiline, 'is-hovered': isHovered }"
         @click="copyMessage"
         @contextmenu="copyMessage"
         @mouseenter="isHovered = true"
         @mouseleave="isHovered = false">
      <span class="msg-content" v-html="textEscaped"></span>
      <span class="copy-icon" v-show="isHovered && !showCopied">⎘</span>
      <span class="copied-badge" v-show="showCopied">✓</span>
    </div>
  </script>

  <!-- Suggestions Template -->
  <script type="text/x-template" id="suggestions_template">
    <ul class="suggestions" v-show="currentSuggestions.length > 0">
      <li class="suggestion" v-for="s in currentSuggestions">
        <p>
          <span :class="{ 'disabled': s.disabled }">
            {{s.name}}
          </span>
          <span class="param"
                v-for="(p, index) in s.params"
                :class="{ 'disabled': p.disabled }">
            [{{p.name}}]
          </span>
        </p>
        <small class="help">
          <template v-if="!s.disabled">
            {{s.help}}
          </template>
          <template v-for="p in s.params" v-if="!p.disabled">
            {{p.help}}
          </template>
        </small>
      </li>
    </ul>
  </script>

  <!-- Scripts -->
  <script type="text/javascript" src="./Suggestions.js"></script>
  <script type="text/javascript" src="./Message.js"></script>
  <script type="text/javascript" src="./App.js"></script>

  <!-- Main Entry -->
  <script type="text/javascript">
  window.post = (url, data) => {
    var request = new XMLHttpRequest();
    request.open('POST', url, true);
    request.setRequestHeader('Content-Type', 'application/json; charset=UTF-8');
    request.send(data);
  }

  const instance = new Vue({
    el: '#app',
    render: h => h(APP),
  });

  window.emulate = (type, detail = {}) => {
    detail.type = type;
    window.dispatchEvent(new CustomEvent('message', {
      detail,
    }));
  };
  </script>

</body>
</html>
