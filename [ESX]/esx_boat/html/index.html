<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمایشگاه قایق</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

	<div id="app" class="hidden">

		<header class="topbar">
			<button id="closeBtn" class="icon-btn" title="بستن (Esc)">✕</button>
			<h2 id="shopTitle" class="shop-title">نمایشگاه قایق</h2>
			<div class="wallet">
				<div class="wallet-row"><span class="wallet-label">نقد</span><span id="cashValue">$0</span></div>
				<div class="wallet-row"><span class="wallet-label">بانک</span><span id="bankValue">$0</span></div>
			</div>
		</header>

		<aside class="vehicle-rail">
			<input id="searchInput" class="search-input" type="text" placeholder="جستجوی مدل...">
			<div id="vehicleList" class="vehicle-list"></div>
		</aside>

		<div class="rotate-hint" id="rotateHint">
			<button id="autoRotateBtn" class="pill-btn">چرخش خودکار: روشن</button>
		</div>

		<footer class="bottom-panel">

			<div id="emptyState" class="empty-state">یک قایق را از لیست کنار انتخاب کنید</div>

			<div id="vehicleDetails" class="vehicle-details hidden">

				<div class="vehicle-heading">
					<h1 id="vehicleName">—</h1>
				</div>

				<div class="stats-row">
					<div class="stat">
						<span class="stat-label">سرعت</span>
						<div class="stat-bar"><div class="stat-fill" id="statSpeed"></div></div>
					</div>
					<div class="stat stat-plain-wrap">
						<span class="stat-label">سرنشین</span>
						<span class="stat-plain" id="statSeats">—</span>
					</div>
				</div>

				<div class="price-row">
					<div class="price-block">
						<span class="price-label">قیمت</span>
						<span class="price-value accent" id="priceValue">$0</span>
					</div>
				</div>

				<div class="actions-row">
					<button id="testDriveBtn" class="action-btn">تست‌درایو</button>
					<button id="buyCashBtn" class="action-btn primary">خرید نقدی</button>
				</div>

			</div>

		</footer>

	</div>

	<div id="testDriveHud" class="test-drive-hud hidden">
		<span class="test-drive-label">تست‌درایو</span>
		<span id="testDriveTimer">00:00</span>
		<span class="test-drive-hint">Backspace برای پایان</span>
	</div>

<script src="app.js"></script>
</body>
</html>
